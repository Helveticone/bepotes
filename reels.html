<button class="rp-back" id="rpBack" type="button">‹ Retour</button>
<button class="rp-create" id="rpCreate" type="button" title="Publier un reel">+</button>
<input type="file" id="reelFile" accept="video/*" style="display:none">

<div class="reels-page" id="rpFeed"></div>

<!-- Feuille de commentaires (reels) -->
<div id="rcSheet" style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center">
  <div style="background:var(--white);width:100%;max-width:560px;max-height:75vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)">
      <b style="font-family:'Plus Jakarta Sans',sans-serif">Commentaires</b>
      <button id="rcClose" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-soft)">&times;</button>
    </div>
    <div id="rcList" style="flex:1;overflow-y:auto;padding:14px 16px"></div>
    <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)">
      <input id="rcInput" type="text" placeholder="Ton commentaire…" maxlength="500" style="flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-family:inherit;background:var(--paper);color:inherit">
      <button id="rcSend" class="btn btn-primary btn-sm">Envoyer</button>
    </div>
  </div>
</div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=109"></script>
<script src="assets/nav.js?v=8"></script>
<script src="assets/bell.js?v=23"></script>
<script src="assets/calls.js?v=3"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const feed=document.getElementById('rpFeed');
  let list=[], muted=true;   // démarre en sourdine (autoplay autorisé), le son s'active au 1er geste

  function slideHTML(r,i){
    const mine = me && r.authorId===me.id;
    return `<div class="rp-slide" data-i="${i}" data-id="${r.id}">
      <video src="${r.video}" ${r.cover?`poster="${r.cover}"`:''} loop playsinline preload="metadata" muted></video>
      <div class="rp-grad"></div>
      <div class="rp-actions">
        <button class="rp-like ${r.likedByMe?'on':''}" type="button" aria-label="J'aime">
          <span class="em">${r.likedByMe?'❤️':'🤍'}</span><span class="rp-lc">${r.likes||0}</span>
        </button>
        <button class="rp-comment" type="button" aria-label="Commentaires">
          <span class="em">💬</span><span class="rp-cc">${r.commentCount||0}</span>
        </button>
        <button class="rp-mute" type="button" aria-label="Son"><span class="em">🔇</span></button>
        ${mine?`<button class="rp-del" type="button" aria-label="Supprimer"><span class="em">🗑</span></button>`:''}
      </div>
      <div class="rp-info">
        <a class="rp-author" href="membre.html?id=${r.authorId}">${JP.avatarHTML(r.author,r.avatar,'av')}<b>${JP.esc(r.author)}</b></a>
        ${r.caption?`<div class="rp-cap">${JP.esc(r.caption)}</div>`:''}
        ${r.town?`<div class="rp-town">📍 ${JP.esc(r.town)}</div>`:''}
      </div>
    </div>`;
  }

  function paintMuteButtons(){
    feed.querySelectorAll('.rp-mute .em').forEach(s=>s.textContent = muted?'🔇':'🔊');
  }

  /* ---- Commentaires d'un reel (feuille du bas) ---- */
  const rcSheet=document.getElementById('rcSheet'), rcList=document.getElementById('rcList'), rcInput=document.getElementById('rcInput');
  let rcReel=null, rcCountEl=null;
  function closeRC(){ rcSheet.style.display='none'; rcReel=null; rcCountEl=null; rcList.innerHTML=''; rcInput.value=''; }
  document.getElementById('rcClose').addEventListener('click',closeRC);
  rcSheet.addEventListener('click',e=>{ if(e.target===rcSheet) closeRC(); });
  async function paintRC(){
    let cs=[]; try{ cs=await JP.commentsOf(rcReel.id); }catch(e){}
    rcList.innerHTML = cs.length ? cs.map(c=>`<div style="display:flex;gap:10px;margin-bottom:12px">
        ${JP.avatarHTML(c.author,c.avatar,'av')}
        <div style="flex:1;min-width:0"><b style="font-size:.9rem">${JP.esc(c.author)}</b>
          <div style="font-size:.92rem;overflow-wrap:anywhere">${JP.mentionHTML?JP.mentionHTML(c.text):JP.esc(c.text)}</div></div>
      </div>`).join('') : '<div style="color:var(--ink-soft);text-align:center;padding:24px">Sois le premier à commenter ce reel !</div>';
  }
  async function openReelComments(reel, countEl){
    rcReel=reel; rcCountEl=countEl;
    rcSheet.style.display='flex';
    rcList.innerHTML='<div style="color:var(--ink-soft);text-align:center;padding:24px">Chargement…</div>';
    await paintRC();
  }
  async function sendRC(){
    const t=rcInput.value.trim(); if(!t || !rcReel) return;
    rcInput.value='';
    try{ await JP.addComment(rcReel.id, t); }catch(e){ JP.toast('Échec'); return; }
    rcReel.commentCount=(rcReel.commentCount||0)+1;
    if(rcCountEl) rcCountEl.textContent=rcReel.commentCount;
    await paintRC();
  }
  document.getElementById('rcSend').addEventListener('click',sendRC);
  rcInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); sendRC(); } });

  function render(){
    if(!list.length){
      feed.innerHTML='<div class="rp-empty"><div><div style="font-size:2.4rem">🎬</div>'
        +'<h2 style="font-family:\'Plus Jakarta Sans\',sans-serif">Pas encore de reels</h2>'
        +'<p style="opacity:.8;max-width:280px;margin:8px auto 0">Sois le premier à publier une vidéo verticale courte pour le Jura&nbsp;!</p>'
        +'<button class="btn btn-primary" id="rpCreate2">+ Publier un reel</button></div></div>';
      document.getElementById('rpCreate2').addEventListener('click',()=>document.getElementById('reelFile').click());
      return;
    }
    feed.innerHTML=list.map(slideHTML).join('');
    const vids=[...feed.querySelectorAll('video')];

    // Autoplay de la vignette visible, pause des autres
    if('IntersectionObserver' in window){
      const io=new IntersectionObserver(es=>es.forEach(en=>{
        const v=en.target;
        if(en.isIntersecting && en.intersectionRatio>0.6){ v.muted=muted; v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); }); }
        else { v.pause(); }
      }),{threshold:[0,0.6,1]});
      vids.forEach(v=>io.observe(v));
    } else if(vids[0]){ vids[0].muted=muted; vids[0].play().catch(()=>{}); }

    // Tap sur la vidéo = lecture / pause
    vids.forEach(v=>v.addEventListener('click',()=>{ if(v.paused) v.play().catch(()=>{}); else v.pause(); }));

    // Son (global) : 1er clic = active le son partout
    feed.querySelectorAll('.rp-mute').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      muted=!muted; paintMuteButtons();
      vids.forEach(v=>{ v.muted=muted; });
    }));

    // J'aime
    feed.querySelectorAll('.rp-like').forEach(b=>b.addEventListener('click',async e=>{
      e.stopPropagation();
      const slide=b.closest('.rp-slide'); const r=list[+slide.dataset.i];
      const on=!r.likedByMe; r.likedByMe=on; r.likes=(r.likes||0)+(on?1:-1);
      b.classList.toggle('on',on);
      b.querySelector('.em').textContent=on?'❤️':'🤍';
      b.querySelector('.rp-lc').textContent=r.likes;
      try{ await JP.toggleLike(r.id); }catch(err){}
    }));

    // Commentaires
    feed.querySelectorAll('.rp-comment').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const slide=b.closest('.rp-slide');
      openReelComments(list[+slide.dataset.i], b.querySelector('.rp-cc'));
    }));

    // Supprimer mon reel
    feed.querySelectorAll('.rp-del').forEach(b=>b.addEventListener('click',async e=>{
      e.stopPropagation();
      const slide=b.closest('.rp-slide'); const r=list[+slide.dataset.i];
      if(!confirm('Supprimer ce reel ?')) return;
      await JP.deletePost(r.id);
      JP.toast('Reel supprimé');
      await load();
    }));

    paintMuteButtons();
  }

  async function load(){
    try{ list=await JP.reels(40); }catch(e){ list=[]; }
    render();
  }

  document.getElementById('rpBack').addEventListener('click',()=>{ location.href='fil.html'; });
  document.getElementById('rpCreate').addEventListener('click',()=>document.getElementById('reelFile').click());
  document.getElementById('reelFile').addEventListener('change', async e=>{
    const file=e.target.files && e.target.files[0]; e.target.value='';
    if(!file) return;
    const caption=prompt('Une légende pour ton reel ? (optionnel)')||'';
    JP.toast('Publication du reel…');
    const r=await JP.addReel(file, caption);
    if(r && r.ok){ JP.toast('Reel publié ! 🎬'); await load(); }
    else if(r && r.needSql){ JP.toast(r.msg, {error:true, ms:7000}); }
    else { JP.toast((r&&r.msg)||'Échec de la publication', {error:true}); }
  });

  await load();
})();
</script>
