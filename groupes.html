<div class="page-pad"><div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:14px;flex-wrap:wrap">
    <div>
      <h1 style="font-size:2rem;margin-bottom:6px">Groupes & communautés</h1>
      <p style="color:var(--ink-soft)">Clubs, quartiers, passions… rejoins les communautés du Jura ou crée la tienne.</p>
    </div>
    <button class="btn btn-primary" id="newGroupBtn">+ Créer un groupe</button>
  </div>
  <div class="group-grid" id="groupGrid"></div>

<div class="modal-bg" id="gModal">
  <div class="modal">
    <div class="modal-head"><h3>Créer un groupe</h3><button class="x" id="gClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label for="gName">Nom du groupe</label><input id="gName" type="text" maxlength="60" placeholder="FC Delémont fans, Rando Jura, Troc & dons…"></div>
      <div class="field"><label for="gTown">Commune (optionnel)</label>
        <select id="gTown">
          <option value="">Tout le Jura</option>
          <option>Delémont</option><option>Porrentruy</option><option>Saignelégier</option>
          <option>Bassecourt</option><option>Courrendlin</option><option>Le Noirmont</option>
          <option>Les Bois</option><option>Courroux</option><option>Alle</option>
          <option>Châtenois</option><option>Vicques</option>
        </select>
      </div>
      <div class="field"><label for="gDesc">Description</label><textarea id="gDesc" maxlength="300" placeholder="De quoi parle ce groupe ?"></textarea></div>
      <div class="field">
        <label>Qui peut rejoindre ?</label>
        <select id="gPrivacy">
          <option value="open">Ouvert — tout le monde rejoint directement</option>
          <option value="private">Sur validation — tu acceptes les demandes</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="gCancel">Annuler</button>
      <button class="btn btn-primary btn-sm" id="gSave">Créer</button>
    </div>
  </div>
</div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=43"></script>

<script src="assets/bell.js?v=22"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  JP.fillCommuneSelect(document.getElementById('gTown'), {first:'Tout le Jura'});
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});
  const grid=document.getElementById('groupGrid');

  async function render(){
    grid.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const gs=await JP.listGroups();
    if(!gs.length){ grid.innerHTML='<div class="empty"><p>Aucun groupe pour l\'instant. Crée le premier !</p></div>'; return; }
    grid.innerHTML=gs.map(g=>`
      <div class="group-card">
        <div class="gcover" ${g.cover?`style="background-image:url(${g.cover})"`:''}></div>
        <div class="gbody">
          <h3>${JP.esc(g.name)}</h3>
          <div class="gtown">📍 ${JP.esc(g.town||'Tout le Jura')}</div>
          <div class="gdesc">${JP.esc(g.description||'')}</div>
          <div class="gfoot">
            <span class="gmembers">${g.memberCount} membre${g.memberCount>1?'s':''}</span>
            <a href="groupe.html?id=${g.id}" class="btn ${g.isMember?'btn-ghost':'btn-primary'} btn-sm">${g.isMember?'Ouvrir':'Voir'}</a>
          </div>
        </div>
      </div>`).join('');
  }

  const modal=document.getElementById('gModal');
  document.getElementById('newGroupBtn').addEventListener('click',()=>{ document.getElementById('gName').value=''; document.getElementById('gDesc').value=''; modal.classList.add('open'); });
  const close=()=>modal.classList.remove('open');
  document.getElementById('gClose').addEventListener('click',close);
  document.getElementById('gCancel').addEventListener('click',close);
  modal.addEventListener('click',e=>{if(e.target===modal)close();});
  document.getElementById('gSave').addEventListener('click',async()=>{
    const name=document.getElementById('gName').value.trim();
    if(!name){ JP.toast('Donne un nom au groupe'); return; }
    const r=await JP.createGroup({name, description:document.getElementById('gDesc').value.trim(), town:document.getElementById('gTown').value, isPrivate:document.getElementById('gPrivacy').value==='private'});
    if(r.ok){ JP.toast('Groupe créé ! 🎉'); location.href='groupe.html?id='+r.id; }
    else JP.toast(r.msg||'Échec');
  });

  await render();
})();
</script>
