<body>
<nav><div class="wrap nav-inner">
  <a href="index.html" class="logo"><span class="brand-dot" aria-hidden="true">B</span><span class="wordmark">be<span class="wm-red">potes</span></span></a>

<div class="page-pad">

  <div class="auth-card">
    <h2>Rejoins les potes 👋</h2>
    <p class="sub">Crée ton compte en 30&nbsp;secondes — c'est gratuit.</p>
    <div id="err" class="alert" style="display:none"></div>
    <div class="field">
      <label for="name">Nom & prénom</label>
      <input id="name" type="text" placeholder="Marie Dupont" autocomplete="name">
    </div>
    <div class="field">
      <label for="town">Ta commune</label>
      <select id="town">
        <option value="">Choisis…</option>
        <option>Bruxelles</option><option>Liège</option><option>Charleroi</option>
        <option>Namur</option><option>Mons</option><option>Seraing</option>
        <option>Verviers</option><option>La Louvière</option><option>Tournai</option>
        <option>Wavre</option><option>Arlon</option><option>Autre commune</option>
      </select>
    </div>
    <div class="field">
      <label for="gender">Tu es…</label>
      <select id="gender">
        <option value="">Choisis…</option>
        <option value="Femme">Une femme</option>
        <option value="Homme">Un homme</option>
        <option value="Autre">Autre</option>
        <option value="Ne se prononce pas">Je préfère ne pas dire</option>
      </select>
    </div>
    <div class="field">
      <label for="birthday">Date de naissance</label>
      <input id="birthday" type="date">
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="toi@email.be" autocomplete="email">
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="howknow">Comment nous as-tu connus ? <span style="font-weight:400;color:var(--ink-soft);font-size:.85em">(optionnel)</span></label>
      <select id="howknow">
        <option value="">Choisis…</option>
        <option value="bouche-à-oreille">Bouche-à-oreille</option>
        
        <option value="réseaux sociaux">Réseaux sociaux</option>
        <option value="presse-affichage">Presse / affichage</option>
        <option value="autre">Autre</option>
      </select>
    </div>
    <!-- piège anti-bot : invisible aux humains, rempli par les robots -->
    <input id="hp_site" name="site_web" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div id="cfTurnstile" style="margin:6px 0"></div>
    <button class="btn btn-primary btn-block" id="go">Créer mon compte</button>
    <div id="oauthWrap" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.85rem;margin:16px 0"><span style="flex:1;height:1px;background:var(--line)"></span>ou<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <button class="btn btn-block" id="googleBtn" type="button" style="background:#fff;color:#1A1416;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuer avec Google
      </button>
    </div>
    <div class="auth-foot">Déjà un compte ? <a href="connexion.html">Se connecter</a></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",function(){
  (async()=>{ await JP.loadMe(); if(JP.user()) location.href='fil.html'; })();

  JP.fillCommuneSelect(document.getElementById('town'), {first:'Choisis ta commune…'});
  const err=document.getElementById('err');
  function showErr(m){err.textContent=m;err.style.display='block';err.style.background='var(--rouge-soft)';err.style.color='var(--rouge-dark)';}
  function showOk(m){err.textContent=m;err.style.display='block';err.style.background='#E6F4EA';err.style.color='#1E5631';}

  /* ---- Anti-bot : honeypot + délai mini + Turnstile (si configuré) ---- */
  const formLoadedAt = Date.now();
  let cfToken = '';
  const CF_KEY = (window.JP_CONFIG && JP_CONFIG.TURNSTILE_SITEKEY) || '';
  if(CF_KEY){
    window.onCfVerify = t => { cfToken = t; };
    const s=document.createElement('script');
    s.src='https://challenges.cloudflare.com/turnstile/v0/api.js'; s.async=true; s.defer=true;
    document.head.appendChild(s);
    const box=document.getElementById('cfTurnstile');
    box.className='cf-turnstile';
    box.setAttribute('data-sitekey', CF_KEY);
    box.setAttribute('data-callback', 'onCfVerify');
  }

  const btn=document.getElementById('go');
  btn.addEventListener('click',async()=>{
    const name=document.getElementById('name').value.trim();
    const town=document.getElementById('town').value;
    const gender=document.getElementById('gender').value;
    const birthday=document.getElementById('birthday').value||null;
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    // pièges anti-bot
    if(document.getElementById('hp_site').value){ return; }                 // honeypot rempli = bot
    if(Date.now()-formLoadedAt < 2500){ return showErr("Petite seconde… réessaie 🙂"); } // trop rapide
    if(!name) return showErr("Indique ton nom.");
    if(!town) return showErr("Choisis ta commune.");
    if(!/^\S+@\S+\.\S+$/.test(email)) return showErr("E-mail invalide.");
    if(password.length<6) return showErr("Mot de passe trop court (min. 6 caractères).");
    if(CF_KEY && !cfToken) return showErr("Confirme que tu n'es pas un robot 🤖");
    btn.disabled=true; btn.textContent='Création…';
    let _src=null; try{ _src=localStorage.getItem('jp-src'); }catch(e){}
    const source = _src || document.getElementById('howknow').value || undefined;
    const r=await JP.register({name,town,gender,birthday,email,password,captchaToken:cfToken||undefined, source});
    btn.disabled=false; btn.textContent='Créer mon compte';
    if(!r.ok){ if(window.turnstile&&CF_KEY){ try{turnstile.reset();}catch(e){} cfToken=''; } return showErr(r.msg); }
    if(r.confirm){ showOk("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi."); return; }
    location.href='fil.html';
  });
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});

  /* Inscription Google (affichée seulement si activée dans config.js) */
  if(window.JP_CONFIG && JP_CONFIG.GOOGLE_AUTH){
    const w=document.getElementById('oauthWrap'); if(w) w.style.display='';
    const g=document.getElementById('googleBtn');
    if(g) g.addEventListener('click',async()=>{ g.disabled=true; const r=await JP.signInWithProvider('google'); if(!r.ok){ g.disabled=false; showErr(r.msg||'Inscription Google indisponible pour le moment.'); } });
  }

});
</script>
