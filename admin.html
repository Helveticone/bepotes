<div class="page-pad"><div class="narrow">
  <h1 style="font-size:2rem;margin-bottom:6px">Modération <span class="admin-badge">ADMIN</span></h1>
  <p style="color:var(--ink-soft);margin-bottom:24px">Signalements reçus des membres. Examine, supprime le contenu ou bannis si nécessaire.</p>

  <div class="search-tabs" id="tabs">
    <button class="active" data-f="open">À traiter</button>
    <button data-f="all">Tous</button>
  </div>

  <div id="reports"></div>
</div></div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=29"></script>
<script src="assets/bell.js?v=21"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  // Garde-fou : réservé aux admins
  if(!JP.isAdmin()){
    document.querySelector('.narrow').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><p>Accès réservé aux administrateurs.</p><a href="fil.html" class="btn btn-primary btn-sm" style="margin-top:14px">Retour au fil</a></div>';
    return;
  }

  let filter='open';
  const REASONS={spam:'Spam',harcelement:'Harcèlement',faux:'Faux compte',illegal:'Contenu illégal',inapproprie:'Inapproprié'};

  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); filter=b.dataset.f; render();
  }));

  async function render(){
    const box=document.getElementById('reports');
    box.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    let reps=await JP.listReports();
    if(filter==='open') reps=reps.filter(r=>r.status==='open');
    if(!reps.length){ box.innerHTML='<div class="empty"><p>'+(filter==='open'?'Aucun signalement à traiter. 🎉':'Aucun signalement.')+'</p></div>'; return; }
    box.innerHTML=reps.map(r=>`
      <div class="report-card" data-id="${r.id}">
        <div class="rc-top">
          <div>
            <span class="rc-reason">${REASONS[r.reason]||JP.esc(r.reason||'Autre')}</span>
            <span style="font-size:.82rem;color:var(--ink-soft);margin-left:8px">${r.targetType==='user'?'Membre signalé':'Publication signalée'} · ${JP.timeAgo(r.ts)}</span>
          </div>
          <span class="rc-status ${r.status}">${r.status==='open'?'À traiter':r.status==='reviewed'?'Traité':'Rejeté'}</span>
        </div>
        <div style="font-size:.85rem;color:var(--ink-soft)">Signalé par ${JP.esc(r.reporterName)}${r.reportedName?' · concerne '+JP.esc(r.reportedName):''}</div>
        ${r.postText?`<div class="rc-content">« ${JP.esc(r.postText.slice(0,200))}${r.postText.length>200?'…':''} »</div>`:''}
        ${r.details?`<div style="font-size:.85rem;margin-top:6px"><b>Détails :</b> ${JP.esc(r.details)}</div>`:''}
        <div class="rc-actions">
          ${r.postId?`<button class="btn btn-ghost btn-sm delPost" data-pid="${r.postId}">🗑 Supprimer la publication</button>`:''}
          ${r.reportedId?`<button class="btn btn-ghost btn-sm banUser" data-uid="${r.reportedId}">🚫 Bannir le membre</button>`:''}
          ${r.status==='open'?`<button class="btn btn-primary btn-sm resolve" data-id="${r.id}">✓ Marquer traité</button>
          <button class="btn btn-ghost btn-sm dismiss" data-id="${r.id}">Rejeter</button>`:''}
        </div>
      </div>`).join('');

    box.querySelectorAll('.delPost').forEach(b=>b.addEventListener('click',async()=>{
      if(confirm('Supprimer définitivement cette publication ?')){ await JP.adminDeletePost(b.dataset.pid); JP.toast('Publication supprimée'); }
    }));
    box.querySelectorAll('.banUser').forEach(b=>b.addEventListener('click',async()=>{
      if(confirm('Bannir ce membre ? Il ne pourra plus utiliser le réseau.')){ await JP.banUser(b.dataset.uid); JP.toast('Membre banni'); }
    }));
    box.querySelectorAll('.resolve').forEach(b=>b.addEventListener('click',async()=>{
      await JP.resolveReport(b.dataset.id,'reviewed'); JP.toast('Marqué comme traité'); await render();
    }));
    box.querySelectorAll('.dismiss').forEach(b=>b.addEventListener('click',async()=>{
      await JP.resolveReport(b.dataset.id,'dismissed'); JP.toast('Signalement rejeté'); await render();
    }));
  }

  await render();
})();
</script>
