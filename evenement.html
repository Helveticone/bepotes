<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const eid=new URLSearchParams(location.search).get('id');
  const host=document.getElementById('ev');
  if(!eid){ host.innerHTML='<div class="empty"><p>Événement introuvable.</p></div>'; return; }
  let ev=null;

  function fullDate(ts){
    if(!ts) return 'Date à venir';
    return new Date(ts).toLocaleString('fr-CH',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  }

  async function load(){
    ev=await JP.getEvent(eid);
    if(!ev){ host.innerHTML='<div class="empty"><p>Événement introuvable ou supprimé.</p></div>'; return; }
    render();
  }

  function render(){
    const goers=ev.attendeeList.filter(a=>a.status==='going');
    host.innerHTML=`
      <div class="group-header">
        <div class="gh-cover" ${ev.cover?`style="background-image:url(${ev.cover})"`:''}>
          ${ev.mine?`<button class="cover-edit" id="evCoverBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Couverture</button>${ev.cover?'<button class="cover-edit" id="evCoverDel" style="right:auto;left:14px">Retirer</button>':''}`:''}
        </div>
        <div class="gh-body" style="display:block">
          <div style="display:flex;gap:14px;align-items:flex-start">
            <div class="ev-datebadge"><div class="d">${ev.day}</div><div class="m">${JP.esc(ev.month)}</div></div>
            <div style="flex:1;min-width:0">
              <h1 style="margin-bottom:4px">${JP.esc(ev.title)}</h1>
              <div class="gh-meta">📅 ${JP.esc(fullDate(ev.ts))}</div>
              ${ev.endTs?`<div class="gh-meta">🏁 Fin : ${JP.esc(fullDate(ev.endTs))}</div>`:''}
              <div class="gh-meta">📍 ${JP.esc(ev.town||'Tout le Jura')}</div>
              <div class="gh-meta">Organisé par ${JP.esc(ev.creatorName)}</div>
            </div>
          </div>
          ${ev.description?`<div class="gh-desc" style="white-space:pre-wrap;margin-top:12px;overflow-wrap:anywhere">${JP.esc(ev.description)}</div>`:''}
          ${ev.images.length?`<div class="post-gallery g${Math.min(ev.images.length,6)}" style="margin-top:14px">${ev.images.slice(0,6).map(u=>`<img src="${u}" alt="" class="gimg">`).join('')}</div>`:''}
          <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
            <button class="btn ${ev.myStatus==='going'?'btn-primary':'btn-ghost'} btn-sm" id="goBtn">${ev.myStatus==='going'?'✓ Je participe':'Je participe'}</button>
            <button class="btn ${ev.myStatus==='interested'?'btn-primary':'btn-ghost'} btn-sm" id="intBtn">${ev.myStatus==='interested'?'✓ Intéressé·e':'Intéressé·e'}</button>
            ${ev.mine?`<button class="btn btn-ghost btn-sm" id="evDel" style="color:var(--rouge)">Supprimer l'événement</button>`:''}
          </div>
          <div class="gh-meta" style="margin-top:12px"><b>${ev.going}</b> participent · <b>${ev.interested}</b> intéressé·e·s</div>
          ${goers.length?`<div class="ev-attendees">${goers.slice(0,16).map(a=>`<a href="membre.html?id=${a.id}" title="${JP.esc(a.name)}">${JP.avatarHTML(a.name,a.avatar,'av')}</a>`).join('')}</div>`:''}
        </div>
      </div>

      <div class="side-card">
        <h3 style="font-family:'Plus Jakarta Sans';font-size:1.05rem;margin-bottom:12px">Discussion</h3>
        <div id="evcomments"></div>
        <div class="comment-form" style="margin-top:12px">
          <input type="text" id="ecText" placeholder="Pose une question, donne ton avis…" maxlength="500">
          <button class="btn btn-primary btn-sm" id="ecSend">Envoyer</button>
        </div>
      </div>`;

    document.getElementById('goBtn').addEventListener('click',async()=>{
      await JP.setEventRsvp(eid, ev.myStatus==='going'?null:'going');
      JP.toast(ev.myStatus==='going'?'Participation annulée':'Tu participes ! 🎉'); await load();
    });
    document.getElementById('intBtn').addEventListener('click',async()=>{
      await JP.setEventRsvp(eid, ev.myStatus==='interested'?null:'interested');
      JP.toast(ev.myStatus==='interested'?'Retiré':'Marqué intéressé·e ✨'); await load();
    });

    const cb=document.getElementById('evCoverBtn');
    if(cb) cb.addEventListener('click',()=>{
      const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*';
      fi.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
        const blob=await JP.cropImage(f,{aspect:2.7,round:false,outW:1600,title:'Couverture de l\'événement'});
        if(!blob) return; JP.toast('Envoi…');
        const r=await JP.updateEventCover(eid, blob);
        if(r.ok){ JP.toast('Couverture mise à jour ✨'); await load(); } else JP.toast(r.msg||'Échec');
      };
      fi.click();
    });
    const cd=document.getElementById('evCoverDel');
    if(cd) cd.addEventListener('click',async()=>{
      if(!confirm('Retirer la couverture ?')) return;
      const r=await JP.updateEvent(eid,{cover_url:null});
      if(r.ok){ JP.toast('Couverture retirée'); await load(); } else JP.toast(r.msg||'Échec');
    });
    const ed=document.getElementById('evDel');
    if(ed) ed.addEventListener('click',async()=>{
      if(!confirm('Supprimer définitivement cet événement ?')) return;
      const r=await JP.deleteEvent(eid);
      if(r.ok){ JP.toast('Événement supprimé'); location.href='evenements.html'; } else JP.toast(r.msg||'Échec');
    });

    const inp=document.getElementById('ecText');
    const send=async()=>{ const t=inp.value.trim(); if(!t) return; inp.value=''; await JP.addEventComment(eid,t); await renderComments(); };
    document.getElementById('ecSend').addEventListener('click',send);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    renderComments();
  }

  async function renderComments(){
    const box=document.getElementById('evcomments'); if(!box) return;
    const cs=await JP.eventComments(eid);
    if(!cs.length){ box.innerHTML='<div style="color:var(--ink-soft);font-size:.9rem">Aucun message. Lance la discussion !</div>'; return; }
    box.innerHTML=cs.map(c=>`
      <div class="comment" data-cid="${c.id}">
        ${JP.avatarHTML(c.author,c.avatar,'av')}
        <div class="bubble"><b>${JP.esc(c.author)}</b><p>${JP.mentionHTML(c.text)}</p>
          <span style="font-size:.72rem;color:var(--ink-soft)">${JP.timeAgo(c.ts)}</span>
          ${c.authorId===me.id?`<button class="cedit ecdel" type="button" data-cid="${c.id}" style="color:var(--rouge)">Supprimer</button>`:''}
        </div>
      </div>`).join('');
    box.querySelectorAll('.ecdel').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Supprimer ce message ?')) return;
      await JP.deleteEventComment(b.dataset.cid); await renderComments();
    }));
  }

  await load();
})();
</script>
