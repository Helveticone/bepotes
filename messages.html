<div class="page-pad"><div class="wrap">
  <div class="msg-layout" id="layout">
    <div class="conv-col">
      <div class="conv-head">
        <h2>Messages</h2>
        <div style="display:flex;gap:6px">
          <button class="conv-new" id="newGroup" title="Nouveau groupe" style="font-size:1rem">👥</button>
          <button class="conv-new" id="newConv" title="Nouvelle conversation">+</button>
        </div>
      </div>
      <div class="conv-items" id="convItems"></div>
    </div>
    <div class="thread-col">
      <div id="threadArea" class="thread-empty">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Choisis une conversation, ou démarres-en une nouvelle avec le bouton +.</p>
      </div>
    </div>
  </div>
</div></div>

<!-- Modale nouvelle conversation -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head"><h3>Nouvelle conversation</h3><button class="x" id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><input id="search" type="text" placeholder="Chercher un membre par son nom…"></div>
      <div id="memberList"></div>
    </div>
  </div>
</div>

<!-- Modale groupe (créer / gérer) -->
<div class="modal-bg" id="groupModal">
  <div class="modal">
    <div class="modal-head"><h3 id="gmTitle">Nouveau groupe</h3><button class="x" id="gmClose">&times;</button></div>
    <div class="modal-body" id="gmBody"></div>
    <div class="modal-foot" id="gmFoot"></div>
  </div>
</div>

<div class="lightbox" id="lightbox"><button class="lb-close" aria-label="Fermer">&times;</button><img id="lbImg" alt=""></div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=72"></script>
<script src="assets/nav.js?v=6"></script>
<script src="assets/bell.js?v=22"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const layout=document.getElementById('layout');
  const convItems=document.getElementById('convItems');
  const threadArea=document.getElementById('threadArea');
  let activeConv=null, unsub=null, unsubReact=null;

  // Agrandir une image envoyée dans le chat
  const _lb=document.getElementById('lightbox');
  function openLightbox(src){ if(!src) return; document.getElementById('lbImg').src=src; _lb.classList.add('open'); }
  _lb.querySelector('.lb-close').addEventListener('click',()=>_lb.classList.remove('open'));
  _lb.addEventListener('click',e=>{ if(e.target===_lb) _lb.classList.remove('open'); });

  /* ---- Liste des conversations ---- */
  async function loadConvs(selectId){
    const convs=await JP.conversations();
    if(!convs.length){
      convItems.innerHTML='<div style="padding:20px;color:var(--ink-soft);font-size:.9rem">Aucune conversation. Clique sur + pour écrire à quelqu\'un.</div>';
    } else {
      convItems.innerHTML=convs.map(c=>`
        <div class="conv-item ${c.id===activeConv?'active':''}" data-id="${c.id}" data-name="${JP.esc(c.name)}" data-avatar="${c.avatar||''}" data-group="${c.isGroup?'1':''}">
          ${JP.avatarHTML(c.name,c.avatar,'av')}
          <div class="ci"><b>${c.isGroup?'👥 ':''}${JP.esc(c.name)}</b><span>${c.lastText?JP.esc(c.lastText):'Démarrez la discussion'}</span></div>
        </div>`).join('');
      convItems.querySelectorAll('.conv-item').forEach(el=>{
        el.addEventListener('click',()=>openThread(el.dataset.id, el.dataset.name, el.dataset.avatar, el.dataset.group==='1'));
      });
    }
    if(selectId){
      const el=convItems.querySelector(`[data-id="${selectId}"]`);
      if(el) openThread(selectId, el.dataset.name, el.dataset.avatar, el.dataset.group==='1');
    }
  }

  /* ---- Ouvrir un fil de discussion ---- */
  async function openThread(convId, name, avatar, isGroup){
    activeConv=convId;
    if(unsub){ unsub(); unsub=null; }
    if(unsubReact){ unsubReact(); unsubReact=null; }
    convItems.querySelectorAll('.conv-item').forEach(e=>e.classList.toggle('active', e.dataset.id===convId));
    layout.classList.add('show-thread');
    threadArea.className='';
    threadArea.style.display='flex';
    threadArea.style.flexDirection='column';
    threadArea.style.minHeight='0';
    threadArea.style.flex='1';

    let membersMap={}, info=null;
    if(isGroup){
      info=await JP.conversationInfo(convId);
      (info.members||[]).forEach(m=>{ membersMap[m.id]={name:m.name, avatar:m.avatar}; });
    }
    const sub = isGroup && info ? `<span style="font-size:.76rem;color:var(--ink-soft)">${info.members.length} membres</span>` : '';
    const manage = isGroup ? `<button class="btn btn-ghost btn-sm" id="gmManage" style="margin-left:auto;flex:0 0 auto">Gérer</button>` : '';
    threadArea.innerHTML=`
      <div class="thread-head">
        <button class="back" id="backBtn">‹</button>
        ${JP.avatarHTML(name,avatar||null,'av')}
        <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${isGroup?'👥 ':''}${JP.esc(name)}</b>${sub}</div>
        ${manage}
      </div>
      <div class="thread-body" id="tbody"></div>
      <div class="composer-zone">
        <div class="reply-bar" id="replyBar" style="display:none">
          <div class="rb-text"><b id="rbName"></b><span id="rbSnippet"></span></div>
          <button class="rb-x" id="rbClose" type="button" aria-label="Annuler">&times;</button>
        </div>
        <div class="img-preview" id="imgPreview" style="display:none"></div>
        <div class="emoji-panel" id="emojiPanel" style="display:none"></div>
        <div class="thread-input">
          <button class="ti-btn" id="emojiBtn" type="button" aria-label="Emoji">😊</button>
          <button class="ti-btn" id="attachBtn" type="button" aria-label="Photo">📎</button>
          <input type="text" id="msgInput" placeholder="Message…" maxlength="1000" autocomplete="off">
          <button class="ti-send" id="sendBtn" type="button" aria-label="Envoyer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
        </div>
      </div>
      <input type="file" id="chatImg" accept="image/*" style="display:none">`;
    document.getElementById('backBtn').addEventListener('click',()=>{ layout.classList.remove('show-thread'); });
    if(isGroup){ const gm=document.getElementById('gmManage'); if(gm) gm.addEventListener('click',()=>openManageGroup(convId)); }

    const tbody=document.getElementById('tbody');
    const shown=new Set();
    const pendingMine=[];   // textes envoyés en optimiste, en attente de l'écho temps réel
    const msgsById={};      // cache pour résoudre les réponses (temps réel)
    const msgs=await JP.messagesOf(convId);
    msgs.forEach(m=>{ shown.add(m.id); if(m.id) msgsById[m.id]=m; });
    tbody.innerHTML=msgs.map(m=>bubbleHTML(m, isGroup, membersMap)).join('');
    scrollBottom(tbody);
    decorateReactions();

    function appendMsg(m){
      if(m.id && shown.has(m.id)) return;
      // Réconciliation : mon propre message qui revient par le temps réel
      if(m.id && m.mine){
        const i=pendingMine.indexOf(m.text||'');
        if(i>=0){ pendingMine.splice(i,1); shown.add(m.id); msgsById[m.id]=m; return; }
      }
      // Résout l'aperçu de réponse depuis le cache local (messages temps réel)
      if(m.replyToId && !m.reply){ const s=msgsById[m.replyToId]; if(s) m.reply={ senderName: s.mine?'Toi':(s.senderName||'Membre'), text:s.text, image:s.image }; }
      if(m.id){ shown.add(m.id); msgsById[m.id]=m; }
      tbody.insertAdjacentHTML('beforeend', bubbleHTML(m, isGroup, membersMap));
      scrollBottom(tbody);
    }

    /* Réactions : récupère + peint les pastilles sous chaque message visible */
    async function decorateReactions(){
      const ids=[...tbody.querySelectorAll('.msg-row[data-mid]')].map(r=>r.dataset.mid).filter(Boolean);
      if(!ids.length) return;
      let map={}; try{ map=await JP.messageReactions(ids); }catch(e){ return; }
      tbody.querySelectorAll('.msg-row[data-mid]').forEach(row=>{
        renderChips(row, map[row.dataset.mid]||[]);
      });
    }
    function renderChips(row, list){
      const box=row.querySelector('.msg-reactions'); if(!box) return;
      if(!list.length){ box.innerHTML=''; return; }
      const counts={}; let mine=null;
      list.forEach(r=>{ counts[r.emoji]=(counts[r.emoji]||0)+1; if(r.mine) mine=r.emoji; });
      box.innerHTML=Object.entries(counts).map(([e,c])=>
        `<button type="button" class="rx-chip ${mine===e?'mine':''}" data-e="${e}">${e} ${c>1?c:''}</button>`).join('');
      box.querySelectorAll('.rx-chip').forEach(ch=>ch.addEventListener('click',async()=>{
        const e=ch.dataset.e; const remove=ch.classList.contains('mine');
        await JP.reactMessage(row.dataset.mid, remove?'':e);
        decorateReactions();
      }));
    }
    // expose pour le menu d'emojis
    tbody._react = async (mid, emoji)=>{ await JP.reactMessage(mid, emoji); decorateReactions(); };

    unsub=JP.subscribeMessages(convId, m=>{ appendMsg(m); loadConvs(); });
    unsubReact=JP.subscribeMessageReactions(()=>{ decorateReactions(); });

    const input=document.getElementById('msgInput');

    /* ---- Réponse à un message ---- */
    let replyTarget=null, pendingImg=null;
    const replyBar=document.getElementById('replyBar'), rbName=document.getElementById('rbName'), rbSnippet=document.getElementById('rbSnippet');
    function setReply(mid){
      const m=msgsById[mid]; if(!m) return;
      replyTarget={ id:mid, name:m.mine?'Toi':(m.senderName||'Membre'), snippet:(m.image&&!m.text)?'📷 Photo':(m.text||'') };
      rbName.textContent=replyTarget.name; rbSnippet.textContent=replyTarget.snippet.slice(0,90);
      replyBar.style.display='flex'; input.focus();
    }
    function clearReply(){ replyTarget=null; replyBar.style.display='none'; }
    document.getElementById('rbClose').addEventListener('click',clearReply);

    /* ---- Image ---- */
    const chatImg=document.getElementById('chatImg'), imgPreview=document.getElementById('imgPreview');
    function clearImg(){ pendingImg=null; imgPreview.style.display='none'; imgPreview.innerHTML=''; }
    document.getElementById('attachBtn').addEventListener('click',()=>chatImg.click());
    chatImg.addEventListener('change',()=>{
      const f=chatImg.files[0]; chatImg.value=''; if(!f) return;
      if(!f.type.startsWith('image/')){ JP.toast('Choisis une image'); return; }
      if(f.size>15*1024*1024){ JP.toast('Image trop lourde (15 Mo max)', {error:true}); return; }
      pendingImg=f;
      imgPreview.innerHTML=`<img src="${URL.createObjectURL(f)}" alt=""><button class="ip-x" type="button" aria-label="Retirer">&times;</button>`;
      imgPreview.style.display='flex';
      imgPreview.querySelector('.ip-x').addEventListener('click',clearImg);
    });

    /* ---- Emojis (composer) ---- */
    const EMO=['😀','😂','🤣','😍','🥰','😘','😎','😉','😜','🤗','🤔','😴','😭','😢','😡','😱','🥳','😬','😅','👍','👎','🙏','👏','🙌','💪','❤️','🔥','🎉','✨','💯','👀','🍻','☀️','🌧️','🐴','🧀','⚽','🎶'];
    const emojiPanel=document.getElementById('emojiPanel');
    emojiPanel.innerHTML=EMO.map(e=>`<button type="button">${e}</button>`).join('');
    document.getElementById('emojiBtn').addEventListener('click',()=>{ emojiPanel.style.display = emojiPanel.style.display==='flex'?'none':'flex'; });
    emojiPanel.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ input.value+=b.textContent; input.focus(); }));

    /* ---- Réponse / agrandir image (délégation sur le fil) ---- */
    tbody.addEventListener('click',e=>{
      const rb=e.target.closest && e.target.closest('.msg-reply-btn');
      if(rb){ const row=rb.closest('.msg-row'); if(row) setReply(row.dataset.mid); return; }
      const im=e.target.closest && e.target.closest('.bubble-img');
      if(im) openLightbox(im.src);
    });

    const send=async()=>{
      const t=input.value.trim();
      if(!t && !pendingImg) return;
      const rt=replyTarget, img=pendingImg;
      input.value=''; emojiPanel.style.display='none'; clearReply(); clearImg();
      appendMsg({ id:null, text:t, image: img?URL.createObjectURL(img):null, ts:new Date().toISOString(), mine:true,
                  reply: rt?{ senderName:rt.name, text:rt.snippet.indexOf('📷')===0?'':rt.snippet, image: rt.snippet.indexOf('📷')===0 } : null });
      pendingMine.push(t);
      const r=await JP.sendMessage(convId, { text:t, image:img, replyTo: rt?rt.id:null });
      if(r && r.error){ JP.toast(img?'Photo non envoyée':'Message non envoyé', {error:true}); }
      loadConvs();
    };
    document.getElementById('sendBtn').addEventListener('click',send);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    input.focus();
  }

  function bubbleHTML(m, group, membersMap){
    const time=new Date(m.ts).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
    let label='';
    if(group && !m.mine){
      const nm = m.senderName || (membersMap && membersMap[m.senderId] && membersMap[m.senderId].name) || 'Membre';
      label=`<span class="bubble-sender">${JP.esc(nm)}</span>`;
    }
    const mid=m.id||'';
    let rq='';
    if(m.reply){ const rt=(m.reply.image && !m.reply.text)?'📷 Photo':(m.reply.text||''); rq=`<div class="bubble-reply"><b>${JP.esc(m.reply.senderName||'')}</b><span>${JP.esc(rt.slice(0,90))}</span></div>`; }
    const img = m.image ? `<img class="bubble-img" src="${m.image}" alt="photo">` : '';
    const txt = m.text ? `<span class="bubble-txt">${JP.esc(m.text)}</span>` : '';
    const acts = mid ? `<button type="button" class="msg-react-btn" aria-label="Réagir">🙂</button><button type="button" class="msg-reply-btn" aria-label="Répondre">↩</button>` : '';
    return `<div class="msg-row ${m.mine?'me':'them'}" data-mid="${mid}">
      <div class="msg-line">
        <div class="bubble-msg ${m.mine?'me':'them'} ${m.image?'has-img':''}">${label}${rq}${img}${txt}<span class="bubble-time">${time}</span></div>
        <div class="msg-acts">${acts}</div>
      </div>
      <div class="msg-reactions"></div>
    </div>`;
  }

  /* ---- Sélecteur d'emoji (réaction à un message) ---- */
  const RX = JP.MSG_REACTIONS || ['👍','❤️','😆','😮','😢','🙏'];
  let rxPop=null;
  const closeRxPop=()=>{ if(rxPop){ rxPop.remove(); rxPop=null; } };
  document.addEventListener('click', e=>{
    const btn=e.target.closest && e.target.closest('.msg-react-btn');
    if(btn){
      e.stopPropagation();
      const row=btn.closest('.msg-row'); const tb=btn.closest('.thread-body');
      const mid=row && row.dataset.mid; if(!mid || !tb) return;
      closeRxPop();
      rxPop=document.createElement('div'); rxPop.className='rx-pop';
      rxPop.innerHTML=RX.map(em=>`<button type="button" data-e="${em}">${em}</button>`).join('');
      document.body.appendChild(rxPop);
      const r=btn.getBoundingClientRect();
      rxPop.style.top=(window.scrollY + r.top - 48)+'px';
      rxPop.style.left=(window.scrollX + Math.max(8, Math.min(r.left-40, window.innerWidth-220)))+'px';
      rxPop.querySelectorAll('button').forEach(b=>b.addEventListener('click',ev=>{
        ev.stopPropagation(); closeRxPop();
        if(tb._react) tb._react(mid, b.dataset.e);
      }));
      return;
    }
    closeRxPop();
  });

  /* ---- Groupes : créer / gérer ---- */
  const groupModal=document.getElementById('groupModal');
  document.getElementById('gmClose').addEventListener('click',()=>groupModal.classList.remove('open'));
  groupModal.addEventListener('click',e=>{ if(e.target===groupModal) groupModal.classList.remove('open'); });
  function friendRow(f, checkbox){
    return `<label class="member-row" style="cursor:pointer">${checkbox?`<input type="checkbox" value="${f.id}" style="margin-right:8px">`:''}${JP.avatarHTML(f.name,f.avatar,'av')}<div><b>${JP.esc(f.name)}</b><span>${JP.esc(f.town||'')}</span></div></label>`;
  }
  async function openCreateGroup(){
    document.getElementById('gmTitle').textContent='Nouveau groupe';
    const friends=await JP.friends();
    document.getElementById('gmBody').innerHTML=
      `<div class="field"><label>Nom du groupe</label><input id="gmName" type="text" maxlength="60" placeholder="Sortie raquettes, Comité…"></div>`+
      `<div class="field"><label>Ajoute des amis</label><div id="gmMembers">${friends.length?friends.map(f=>friendRow(f,true)).join(''):'<p style="color:var(--ink-soft)">Ajoute d\'abord des amis pour créer un groupe.</p>'}</div></div>`;
    document.getElementById('gmFoot').innerHTML='<button class="btn btn-ghost btn-sm" id="gmCancel">Annuler</button><button class="btn btn-primary btn-sm" id="gmCreate">Créer le groupe</button>';
    document.getElementById('gmCancel').addEventListener('click',()=>groupModal.classList.remove('open'));
    document.getElementById('gmCreate').addEventListener('click',async()=>{
      const name=document.getElementById('gmName').value.trim();
      const ids=[...document.querySelectorAll('#gmMembers input:checked')].map(c=>c.value);
      if(!ids.length){ JP.toast('Choisis au moins une personne'); return; }
      const r=await JP.createGroupConversation(name, ids);
      if(r.ok){ groupModal.classList.remove('open'); await loadConvs(); openThread(r.id, name||'Groupe', '', true); }
      else JP.toast(r.msg||'Échec');
    });
    groupModal.classList.add('open');
  }
  async function openManageGroup(convId){
    const info=await JP.conversationInfo(convId);
    document.getElementById('gmTitle').textContent='Gérer le groupe';
    const friends=await JP.friends();
    const memberIds=new Set(info.members.map(m=>m.id));
    const toAdd=friends.filter(f=>!memberIds.has(f.id));
    document.getElementById('gmBody').innerHTML=
      `<div class="field"><label>Nom du groupe</label><input id="gmName" type="text" maxlength="60" value="${JP.esc(info.title)}"></div>`+
      `<div class="field"><label>Membres (${info.members.length})</label>${info.members.map(m=>`<div class="member-row">${JP.avatarHTML(m.name,m.avatar,'av')}<div><b>${JP.esc(m.name)}${m.mine?' (toi)':''}</b></div></div>`).join('')}</div>`+
      (toAdd.length?`<div class="field"><label>Ajouter des amis</label><div id="gmMembers">${toAdd.map(f=>friendRow(f,true)).join('')}</div></div>`:'');
    document.getElementById('gmFoot').innerHTML='<button class="btn btn-ghost btn-sm" id="gmLeave" style="color:var(--rouge);margin-right:auto">Quitter</button><button class="btn btn-primary btn-sm" id="gmSave">Enregistrer</button>';
    document.getElementById('gmSave').addEventListener('click',async()=>{
      const newName=document.getElementById('gmName').value.trim();
      if(newName && newName!==info.title) await JP.renameConversation(convId, newName);
      const add=[...document.querySelectorAll('#gmMembers input:checked')].map(c=>c.value);
      if(add.length) await JP.addConversationMembers(convId, add);
      groupModal.classList.remove('open');
      JP.toast('Groupe mis à jour ✅');
      await loadConvs();
      openThread(convId, newName||info.title||'Groupe', '', true);
    });
    document.getElementById('gmLeave').addEventListener('click',async()=>{
      if(!confirm('Quitter ce groupe ?')) return;
      await JP.leaveConversation(convId);
      groupModal.classList.remove('open');
      activeConv=null; if(unsub){ unsub(); unsub=null; }
      threadArea.className='thread-empty'; threadArea.style.display='';
      threadArea.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>Choisis une conversation, ou démarres-en une nouvelle.</p>';
      layout.classList.remove('show-thread');
      await loadConvs();
    });
    groupModal.classList.add('open');
  }
  document.getElementById('newGroup').addEventListener('click',openCreateGroup);
  function scrollBottom(el){ el.scrollTop=el.scrollHeight; }

  /* ---- Modale : nouvelle conversation ---- */
  const modal=document.getElementById('modal');
  const memberList=document.getElementById('memberList');
  const search=document.getElementById('search');
  async function showMembers(q){
    memberList.innerHTML='<p style="color:var(--ink-soft);padding:10px">Chargement…</p>';
    let ms=await JP.friends();
    if(q){ const t=q.toLowerCase(); ms=ms.filter(m=>(m.name||'').toLowerCase().includes(t)); }
    if(!ms.length){ memberList.innerHTML='<p style="color:var(--ink-soft);padding:10px">'+(q?'Aucun ami à ce nom.':'Tu n\'as pas encore d\'amis. Ajoute des amis pour leur écrire !')+'</p>'; return; }
    memberList.innerHTML=ms.map(m=>`
      <div class="member-row" data-id="${m.id}">
        ${JP.avatarHTML(m.name,m.avatar,'av')}
        <div><b>${JP.esc(m.name)}</b><span>${JP.esc(m.town||'')}</span></div>
      </div>`).join('');
    memberList.querySelectorAll('.member-row').forEach(el=>{
      el.addEventListener('click',async()=>{
        modal.classList.remove('open');
        const cid=await JP.openConversationWith(el.dataset.id);
        if(typeof cid==='string'){ await loadConvs(); openThread(cid, el.querySelector('b').textContent, ''); }
        // sinon openConversationWith a déjà affiché un toast (ex: pas amis)
      });
    });
  }
  document.getElementById('newConv').addEventListener('click',()=>{ modal.classList.add('open'); search.value=''; showMembers(''); search.focus(); });
  document.getElementById('mClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
  let st; search.addEventListener('input',()=>{ clearTimeout(st); st=setTimeout(()=>showMembers(search.value.trim()),250); });

  /* ---- Démarrage : ouvrir direct une conv si ?to=ID (depuis un profil) ---- */
  const params=new URLSearchParams(location.search);
  const to=params.get('to');
  const convParam=params.get('c');   // ouvrir directement une conversation (ex: depuis le Marché)
  await loadConvs();
  if(convParam){
    await loadConvs(convParam);
  } else if(to){
    const cid=await JP.openConversationWith(to);
    if(typeof cid==='string') await loadConvs(cid);
    // sinon (pas amis) le toast est déjà affiché ; on reste sur la liste
  } else {
    // Pas de cible précise : on ouvre directement la discussion la plus récente
    // (= celle avec le dernier message reçu/envoyé, la liste étant triée par activité).
    const first=convItems.querySelector('.conv-item');
    if(first) openThread(first.dataset.id, first.dataset.name, first.dataset.avatar, first.dataset.group==='1');
  }

  // cloche
})();
</script>
