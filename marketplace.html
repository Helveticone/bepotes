<!-- Modale création -->
<div class="modal-bg" id="newModal">
  <div class="modal">
    <div class="modal-head"><h3>Nouvelle annonce</h3><button class="x" id="nClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label for="nTitle">Titre</label><input id="nTitle" type="text" maxlength="80" placeholder="Vélo enfant, canapé 3 places…"></div>
      <div class="field" style="display:flex;gap:12px">
        <div style="flex:1"><label for="nPrice">Prix (CHF)</label><input id="nPrice" type="number" min="0" step="1" placeholder="Vide = à discuter"></div>
        <div style="flex:1"><label for="nCat">Catégorie</label><select id="nCat"></select></div>
      </div>
      <div class="field"><label for="nTown">Commune</label>
        <select id="nTown">
          <option value="">Tout le Jura</option>
          <option>Delémont</option><option>Porrentruy</option><option>Saignelégier</option>
          <option>Bassecourt</option><option>Courrendlin</option><option>Le Noirmont</option>
          <option>Les Bois</option><option>Courroux</option><option>Alle</option>
          <option>Châtenois</option><option>Vicques</option>
        </select>
      </div>
      <div class="field"><label for="nDesc">Description</label><textarea id="nDesc" maxlength="800" placeholder="État, dimensions, raison de la vente…"></textarea></div>
      <div class="field">
        <label>Photos (max 6)</label>
        <button class="icon-btn" id="photoBtn" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Ajouter des photos</button>
        <div class="comp-previews" id="previews"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="nCancel">Annuler</button>
      <button class="btn btn-primary btn-sm" id="nSave">Publier l'annonce</button>
    </div>
  </div>
</div>

<!-- Modale détail -->
<div class="modal-bg" id="detailModal">
  <div class="modal">
    <div class="modal-head"><h3 id="dTitle"></h3><button class="x" id="dClose">&times;</button></div>
    <div class="modal-body" id="dBody"></div>
  </div>
</div>

<input type="file" id="photoFile" accept="image/*" multiple style="display:none">

<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  JP.fillCommuneSelect(document.getElementById('nTown'), {first:'Tout le Jura'});
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const CATS=['Divers','Meubles','Électronique','Véhicules','Vêtements','Maison & Jardin','Loisirs','Enfants','Immobilier','Services','Dons / Gratuit'];
  const grid=document.getElementById('grid');
  let pendingImages=[];

  // remplir les selects de catégorie
  const catFilter=document.getElementById('catFilter');
  catFilter.innerHTML='<option value="">Toutes les catégories</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('nCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
  const townFilter=document.getElementById('townFilter');
  JP.fillCommuneSelect(townFilter, {first:'📍 Toutes les communes'});
  townFilter.addEventListener('change',()=>render());

  function priceLabel(p){
    if(p===null||p===undefined) return 'Prix à discuter';
    const n=Number(p);
    if(n===0) return 'Gratuit';
    return (Number.isInteger(n)?n:n.toFixed(2))+' CHF';
  }

  async function render(){
    grid.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const items=await JP.listListings({ search:document.getElementById('q').value.trim(), category:catFilter.value, town:townFilter.value });
    if(!items.length){ grid.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M9 13h6"/></svg><p>Aucune annonce. Sois le premier à publier !</p></div>'; return; }
    grid.innerHTML=items.map(l=>`
      <div class="mkt-card" data-id="${l.id}">
        <div class="mkt-img" ${l.images[0]?`style="background-image:url(${l.images[0]})"`:''}>
          ${l.status==='sold'?'<span class="sold">Vendu</span>':''}
        </div>
        <div class="mkt-body">
          <div class="mkt-price">${priceLabel(l.price)}</div>
          <div class="mkt-title">${JP.esc(l.title)}</div>
          <div class="mkt-meta">📍 ${JP.esc(l.town||'Jura')} · ${JP.timeAgo(l.ts)}</div>
        </div>
      </div>`).join('');
    grid.querySelectorAll('.mkt-card').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
  }

  /* ---- Détail ---- */
  const dModal=document.getElementById('detailModal');
  async function openDetail(id){
    const l=await JP.getListing(id);
    if(!l){ JP.toast('Annonce introuvable'); return; }
    document.getElementById('dTitle').textContent=l.title;
    const gallery=l.images.length
      ? `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">${l.images.map(u=>`<img src="${u}" alt="" style="width:100%;border-radius:12px;display:block">`).join('')}</div>`
      : '';
    const owner = l.mine
      ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
           <button class="btn btn-ghost btn-sm" id="dSold">${l.status==='sold'?'Remettre en vente':'Marquer comme vendu'}</button>
           <button class="btn btn-ghost btn-sm" id="dDel" style="color:var(--rouge)">Supprimer</button>
         </div>`
      : `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
           <button class="btn btn-primary btn-sm" id="contactSeller" data-id="${l.sellerId}">Contacter le vendeur</button>
           <a class="btn btn-ghost btn-sm" href="membre.html?id=${l.sellerId}">Voir le profil</a>
         </div>`;
    document.getElementById('dBody').innerHTML=`
      ${l.status==='sold'?'<div class="alert" style="margin-bottom:12px">Cette annonce est marquée comme vendue.</div>':''}
      <div class="mkt-price" style="font-size:1.5rem;margin-bottom:6px">${priceLabel(l.price)}</div>
      <div style="font-size:.85rem;color:var(--ink-soft);margin-bottom:14px">${JP.esc(l.category)} · 📍 ${JP.esc(l.town||'Jura')} · ${JP.timeAgo(l.ts)}</div>
      ${gallery}
      ${l.description?`<p style="white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere">${JP.esc(l.description)}</p>`:''}
      <div class="pending-row" style="margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:11px 14px">
        ${JP.avatarHTML(l.sellerName,l.sellerAvatar,'av')}
        <div class="pi"><b>${JP.esc(l.sellerName)}</b><span style="font-size:.8rem;color:var(--ink-soft)">📍 ${JP.esc(l.sellerTown||'Jura')}</span></div>
      </div>
      ${owner}`;
    dModal.classList.add('open');
    const sold=document.getElementById('dSold');
    if(sold) sold.addEventListener('click',async()=>{
      const r=await JP.markListingSold(l.id, l.status!=='sold');
      if(r.ok){ JP.toast('Annonce mise à jour ✅'); dModal.classList.remove('open'); await render(); }
      else JP.toast(r.msg||'Échec');
    });
    const del=document.getElementById('dDel');
    if(del) del.addEventListener('click',async()=>{
      if(!confirm('Supprimer cette annonce ?')) return;
      const r=await JP.deleteListing(l.id);
      if(r.ok){ JP.toast('Annonce supprimée'); dModal.classList.remove('open'); await render(); }
      else JP.toast(r.msg||'Échec');
    });
    const contact=document.getElementById('contactSeller');
    if(contact) contact.addEventListener('click',async()=>{
      contact.disabled=true; contact.textContent='Ouverture…';
      const cid=await JP.contactSeller(contact.dataset.id);
      if(cid) location.href='messages.html?c='+cid;
      else { contact.disabled=false; contact.textContent='Contacter le vendeur'; }
    });
  }
  document.getElementById('dClose').addEventListener('click',()=>dModal.classList.remove('open'));
  dModal.addEventListener('click',e=>{ if(e.target===dModal) dModal.classList.remove('open'); });

  /* ---- Création ---- */
  const nModal=document.getElementById('newModal');
  const photoFile=document.getElementById('photoFile');
  function renderPreviews(){
    const box=document.getElementById('previews');
    box.innerHTML=pendingImages.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"><button class="rm" data-i="${i}" type="button">&times;</button></div>`).join('');
    box.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',()=>{ pendingImages.splice(+b.dataset.i,1); renderPreviews(); }));
  }
  document.getElementById('photoBtn').addEventListener('click',()=>photoFile.click());
  photoFile.addEventListener('change',e=>{
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    for(const f of files){ if(pendingImages.length<6) pendingImages.push(f); }
    if([...e.target.files].length && pendingImages.length>=6) JP.toast('6 photos maximum');
    renderPreviews(); photoFile.value='';
  });
  function openNew(){
    document.getElementById('nTitle').value=''; document.getElementById('nPrice').value='';
    document.getElementById('nDesc').value=''; pendingImages=[]; renderPreviews();
    nModal.classList.add('open');
  }
  document.getElementById('newBtn').addEventListener('click',openNew);
  const closeNew=()=>nModal.classList.remove('open');
  document.getElementById('nClose').addEventListener('click',closeNew);
  document.getElementById('nCancel').addEventListener('click',closeNew);
  nModal.addEventListener('click',e=>{ if(e.target===nModal) closeNew(); });
  document.getElementById('nSave').addEventListener('click',async()=>{
    const title=document.getElementById('nTitle').value.trim();
    if(!title){ JP.toast('Donne un titre à ton annonce'); return; }
    const btn=document.getElementById('nSave'); btn.disabled=true; btn.textContent='Publication…';
    const r=await JP.createListing({
      title,
      price:document.getElementById('nPrice').value,
      category:document.getElementById('nCat').value,
      town:document.getElementById('nTown').value,
      description:document.getElementById('nDesc').value.trim(),
      images:pendingImages
    });
    btn.disabled=false; btn.textContent="Publier l'annonce";
    if(r.ok){ JP.toast('Annonce publiée ! 🎉'); closeNew(); await render(); }
    else JP.toast(r.msg||'Échec');
  });

  /* ---- Filtres ---- */
  document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render();});
  catFilter.addEventListener('change',render);

  await render();
})();
</script>
