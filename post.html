<div class="page-pad"><div class="narrow">

</div></div>

<div class="lightbox" id="lightbox"><button class="lb-close">&times;</button><img id="lbImg" alt=""></div>

<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const pid=new URLSearchParams(location.search).get('id');
  const host=document.getElementById('post');
  if(!pid){ host.innerHTML='<div class="empty"><p>Publication introuvable.</p></div>'; return; }

  function galleryHTML(images){
    const imgs=(images||[]).filter(Boolean);
    if(!imgs.length) return '';
    const n=Math.min(imgs.length,6);
    return `<div class="post-gallery g${n}">`+imgs.slice(0,6).map(u=>`<img src="${u}" alt="" class="gimg">`).join('')+`</div>`;
  }
  function sharedCardHTML(s){
    return `<a href="post.html?id=${s.id}" class="shared-card">
      <div class="sc-head">${JP.avatarHTML(s.author,s.authorAvatar,'av')}<b>${JP.esc(s.author)}</b></div>
      ${s.text?`<div class="sc-text">${JP.esc(s.text)}</div>`:''}
      ${s.image?`<img src="${s.image}" alt="" class="sc-img">`:''}
    </a>`;
  }
  function commentHTML(c){
    return `<div class="comment" data-cid="${c.id}">
      ${JP.avatarHTML(c.author,c.avatar,'av')}
      <div class="bubble"><b>${JP.esc(c.author)}</b><p>${JP.esc(c.text)}</p>
        <button class="clike ${c.liked?'liked':''}" type="button" data-cid="${c.id}">♥ <span class="cl-count">${c.likes}</span></button>
      </div></div>`;
  }

  let p=null, sort='all';

  async function load(){
    p=await JP.getPost(pid);
    if(!p){ host.innerHTML='<div class="empty"><p>Publication introuvable ou supprimée.</p></div>'; return; }
    render();
  }

  function render(){
    host.innerHTML=`<article class="post">
      <div class="post-head">
        <a href="membre.html?id=${p.authorEmail}" style="text-decoration:none">${JP.avatarHTML(p.author,p.authorAvatar,'av')}</a>
        <div class="meta"><b><a href="membre.html?id=${p.authorEmail}" style="color:inherit;text-decoration:none">${JP.esc(p.author)}</a></b><span>${JP.esc(p.town)} · ${JP.timeAgo(p.ts)}</span></div>
        <span class="tag">${JP.esc(p.tag)}</span>
      </div>
      <div class="post-body">${JP.esc(p.text)}</div>
      ${galleryHTML(p.images)}
      ${p.shared?sharedCardHTML(p.shared):''}
      <div class="post-actions">
        <button class="act like ${JP.isLiked(p)?'liked':''}"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="lc">${p.likes}</span></button>
        <button class="act cbtn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${p.comments.length}</span></button>
        <button class="act sh-link"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg> Copier le lien</button>
      </div>
      <div class="comments open">
        ${p.comments.length>1?`<div class="comments-controls"><select class="csort">
          <option value="all">Tous les commentaires</option>
          <option value="recent">Les plus récents</option>
          <option value="top">Le plus de like</option>
        </select></div>`:''}
        <div class="comment-list"></div>
        <div class="comment-form">
          <input type="text" placeholder="Écris un commentaire…" maxlength="240">
          <button class="btn btn-primary btn-sm csend">Envoyer</button>
        </div>
      </div>
    </article>`;

    const likeBtn=host.querySelector('.like');
    likeBtn.addEventListener('click',async()=>{
      const liked=likeBtn.classList.contains('liked');
      likeBtn.classList.toggle('liked',!liked);
      const lc=host.querySelector('.lc'); lc.textContent=Math.max(0,parseInt(lc.textContent)+(liked?-1:1));
      await JP.toggleLike(pid);
    });
    host.querySelector('.sh-link').addEventListener('click',()=>{
      const url=location.origin+'/post.html?id='+pid;
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>JP.toast('Lien copié 🔗'),()=>JP.toast('Lien : '+url));
      else JP.toast('Lien : '+url);
    });
    host.querySelector('.cbtn').addEventListener('click',()=>host.querySelector('.comment-form input').focus());
    host.querySelectorAll('.gimg').forEach(img=>img.addEventListener('click',()=>{
      document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open');
    }));

    const sel=host.querySelector('.csort');
    if(sel){ sel.value=sort; sel.addEventListener('change',()=>{ sort=sel.value; paintComments(); }); }
    const inp=host.querySelector('.comment-form input');
    const send=async()=>{ const t=inp.value.trim(); if(!t) return; inp.value=''; await JP.addComment(pid,t); await load(); };
    host.querySelector('.csend').addEventListener('click',send);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    paintComments();
  }

  function paintComments(){
    const box=host.querySelector('.comment-list'); if(!box) return;
    const byRecent=(a,b)=>new Date(b.ts)-new Date(a.ts);
    const sorters={ all:(a,b)=>new Date(a.ts)-new Date(b.ts), recent:byRecent, top:(a,b)=>(b.likes-a.likes)||byRecent(a,b) };
    const list=p.comments.slice().sort(sorters[sort]||sorters.all);
    box.innerHTML=list.map(commentHTML).join('');
    box.querySelectorAll('.clike').forEach(b=>b.addEventListener('click',async()=>{
      const cid=b.dataset.cid, c=p.comments.find(x=>x.id===cid); if(!c) return;
      c.liked=!c.liked; c.likes=Math.max(0,c.likes+(c.liked?1:-1));
      b.classList.toggle('liked',c.liked);
      const cc=b.querySelector('.cl-count'); if(cc) cc.textContent=c.likes;
      await JP.toggleCommentLike(cid);
    }));
  }

  const lb=document.getElementById('lightbox');
  lb.querySelector('.lb-close').addEventListener('click',()=>lb.classList.remove('open'));
  lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.remove('open'); });

  await load();
})();
</script>
