<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});
  const list=document.getElementById('list');

  const ICON = { like:'❤️', comment:'💬', follow:'👋', message:'✉️', friend_request:'🤝', friend_accept:'✅', mention:'📣', phototag:'🏷️', msg_reaction:'👍' };

  async function render(){
    list.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const ns=await JP.notifications();
    if(!ns.length){
      list.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><p>Aucune notification pour l\'instant. Quand on aimera ou commentera tes publications, tu le verras ici.</p></div>';
      return;
    }
    list.innerHTML=ns.map(n=>`
      <div class="notif clickable ${n.read?'':'unread'}" data-link="${n.link}">
        ${JP.avatarHTML(n.actorName,n.actorAvatar,'av')}
        <div class="txt"><b>${JP.esc(n.actorName)}</b> ${JP.esc(JP.notifText(n.type))}
          <span class="when">${JP.timeAgo(n.ts)}</span>
        </div>
        <div class="ico ${n.type}">${ICON[n.type]||'🔔'}</div>
      </div>`).join('');
    list.querySelectorAll('.notif.clickable').forEach(el=>{
      el.addEventListener('click',()=>{ location.href=el.dataset.link; });
    });
    // Marquer comme lues après affichage
    await JP.markAllRead();
    updateBell();
  }

  async function updateBell(){
    const c=await JP.unreadCount();
    const b=document.getElementById('bellCount');
    if(c>0){ b.textContent=c>99?'99+':c; b.classList.add('show'); }
    else b.classList.remove('show');
  }

  document.getElementById('readAll').addEventListener('click',async()=>{
    await JP.markAllRead(); JP.toast('Tout est lu ✅'); await render();
  });

  await render();
})();
</script>
