<!-- Modale création d'événement -->
<div class="modal-bg" id="evModal">
  <div class="modal">
    <div class="modal-head"><h3>Créer un événement</h3><button class="x" id="evClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label for="evTitle">Titre</label><input id="evTitle" type="text" maxlength="80" placeholder="Marché du terroir, concert, loto…"></div>
      <div class="field"><label for="evTown">Commune</label>
        <select id="evTown">
          <option>Delémont</option><option>Porrentruy</option><option>Saignelégier</option>
          <option>Bassecourt</option><option>Courrendlin</option><option>Le Noirmont</option>
          <option>Les Bois</option><option>Courroux</option><option>Alle</option>
          <option>Châtenois</option><option>Vicques</option><option>Autre commune du Jura</option>
        </select>
      </div>
      <div class="field"><label for="evDate">Date et heure</label><input id="evDate" type="datetime-local"></div>
      <div class="field"><label for="evDesc">Description (optionnel)</label><textarea id="evDesc" maxlength="400" placeholder="Détails, lieu précis, infos pratiques…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="evCancel">Annuler</button>
      <button class="btn btn-primary btn-sm" id="evSave">Publier l'événement</button>
    </div>
  </div>
</div>

<script src="/assets/supabase.min.js?v=18"></script>

<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});
  const list=document.getElementById('evList');

  async function render(){
    list.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const evs=await JP.events();
    if(!evs.length){ list.innerHTML='<div class="empty"><p>Aucun événement pour l\'instant.</p></div>'; return; }
    list.innerHTML=evs.map(e=>{
      const going=JP.isGoing(e);
      return `
      <div class="ev" data-id="${e.id}">
        <div class="date"><div class="d">${e.day}</div><div class="m">${JP.esc(e.month)}</div></div>
        <div class="info">
          <h3>${JP.esc(e.title)}</h3>
          <div class="loc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${JP.esc(e.town||'')}</div>
          <div class="going"><span class="gc">${e.going}</span> Jurassien·ne·s participent</div>
        </div>
        <div style="display:flex;align-items:center;padding:0 18px">
          <button class="btn ${going?'btn-primary':'btn-ghost'} btn-sm rsvp">${going?'✓ J\'y vais':'Je participe'}</button>
        </div>
      </div>`;}).join('');
    evs.forEach(e=>{
      const el=list.querySelector(`[data-id="${e.id}"]`);
      el.querySelector('.rsvp').addEventListener('click',async()=>{
        const going=await JP.toggleGoing(e.id);
        JP.toast(going?'Tu participes ! 🎉':'Participation annulée');
        await render();
      });
    });
  }

  /* ---- Modale création d'événement ---- */
  const evModal=document.getElementById('evModal');
  document.getElementById('newEvBtn').addEventListener('click',()=>{
    document.getElementById('evTitle').value='';
    document.getElementById('evDesc').value='';
    evModal.classList.add('open');
  });
  const closeEv=()=>evModal.classList.remove('open');
  document.getElementById('evClose').addEventListener('click',closeEv);
  document.getElementById('evCancel').addEventListener('click',closeEv);
  evModal.addEventListener('click',e=>{if(e.target===evModal)closeEv();});
  document.getElementById('evSave').addEventListener('click',async()=>{
    const title=document.getElementById('evTitle').value.trim();
    const town=document.getElementById('evTown').value;
    const dateVal=document.getElementById('evDate').value;
    const desc=document.getElementById('evDesc').value.trim();
    if(!title){ JP.toast('Donne un titre à l\'événement'); return; }
    if(!dateVal){ JP.toast('Choisis une date'); return; }
    const r=await JP.createEvent({title, town, starts_at:new Date(dateVal).toISOString(), description:desc});
    if(r.ok){ JP.toast('Événement créé ! 🎉'); closeEv(); await render(); }
    else JP.toast(r.msg||'Échec de la création');
  });

  await render();
})();
</script>
