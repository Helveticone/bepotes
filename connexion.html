<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Jurapotes</title>
<meta name="description" content="Connecte-toi à Jurapotes, le réseau social local du canton du Jura.">
<link rel="canonical" href="https://jurapotes.ch/connexion.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=76">
<script src="assets/theme.js?v=1"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E11D2A">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurapotes">
</head>
<body>
<nav><div class="wrap nav-inner">
  <a href="index.html" class="logo"><span class="brand-dot" aria-hidden="true">J</span><span class="wordmark">jura<span class="wm-red">potes</span></span></a>
  <div class="nav-links"><a href="fil.html">Le fil</a><a href="evenements.html">Événements</a><a href="inscription.html" class="btn btn-primary">Rejoindre</a></div>
</div></nav>

<div class="page-pad">
  <div class="auth-card">
    <h2>Re-bonjour 👋</h2>
    <p class="sub">Connecte-toi pour retrouver tes potes.</p>
    <div id="err" class="alert" style="display:none"></div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="toi@email.ch" autocomplete="email">
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="go">Se connecter</button>
    <div class="auth-foot">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
  </div>
</div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=72"></script>
<script>
  (async()=>{ await JP.loadMe(); if(JP.user()) location.href='fil.html'; })();
  const err=document.getElementById('err');
  function showErr(m){err.textContent=m;err.style.display='block';}
  const btn=document.getElementById('go');
  btn.addEventListener('click',async()=>{
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    if(!email||!password) return showErr("Remplis les deux champs.");
    btn.disabled=true; btn.textContent='Connexion…';
    const r=await JP.login({email,password});
    btn.disabled=false; btn.textContent='Se connecter';
    if(!r.ok) return showErr(r.msg);
    location.href='fil.html';
  });
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
</script>
<script src="/assets/pwa.js?v=20"></script>
</body>
</html>
