<body>
<nav><div class="wrap nav-inner">
  <a href="index.html" class="logo"><span class="brand-dot" aria-hidden="true">J</span><span class="wordmark">jura<span class="wm-red">potes</span></span></a>
  <div class="nav-links"><a href="fil.html">Le fil</a><a href="evenements.html">Événements</a><a href="inscription.html" class="btn btn-primary">Rejoindre</a></div>
</div></nav>

<div class="page-pad">
  <div class="auth-card">
    <h2>Re-bonjour 👋</h2>
    <p class="sub">Connecte-toi pour retrouver tes potes.</p>
    <div id="err" class="alert" style="display:none"></div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="toi@email.ch" autocomplete="email">
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="go">Se connecter</button>
    <div id="oauthWrap" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.85rem;margin:16px 0"><span style="flex:1;height:1px;background:var(--line)"></span>ou<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <button class="btn btn-block" id="googleBtn" type="button" style="background:#fff;color:#1A1416;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuer avec Google
      </button>
    </div>
    <div class="auth-foot">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",function(){
  (async()=>{ await JP.loadMe(); if(JP.user()) location.href='fil.html'; })();
  const err=document.getElementById('err');
  function showErr(m){err.textContent=m;err.style.display='block';}
  const btn=document.getElementById('go');
  btn.addEventListener('click',async()=>{
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    if(!email||!password) return showErr("Remplis les deux champs.");
    btn.disabled=true; btn.textContent='Connexion…';
    const r=await JP.login({email,password});
    btn.disabled=false; btn.textContent='Se connecter';
    if(!r.ok) return showErr(r.msg);
    location.href='fil.html';
  });
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});

  /* Connexion Google (affichée seulement si activée dans config.js) */
  if(window.JP_CONFIG && JP_CONFIG.GOOGLE_AUTH){
    const w=document.getElementById('oauthWrap'); if(w) w.style.display='';
    const g=document.getElementById('googleBtn');
    if(g) g.addEventListener('click',async()=>{ g.disabled=true; const r=await JP.signInWithProvider('google'); if(!r.ok){ g.disabled=false; showErr(r.msg||'Connexion Google indisponible pour le moment.'); } });
  }

});
</script>
</body>
</html>
