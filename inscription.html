<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription gratuite — Jurapotes, le réseau social du Jura</title>
<meta name="description" content="Crée ton compte gratuit sur Jurapotes et rejoins la communauté des habitants du canton du Jura : fil d'actu, amis, groupes, marché et événements locaux.">
<link rel="canonical" href="https://jurapotes.ch/inscription.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nvlquqrsjmwgtkhmxazq.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=91">
<script src="assets/theme.js?v=1"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E11D2A">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurapotes">
</head>
<body>
<nav><div class="wrap nav-inner">
  <a href="index.html" class="logo"><span class="brand-dot" aria-hidden="true">J</span><span class="wordmark">jura<span class="wm-red">potes</span></span></a>
  <div class="nav-links"><a href="fil.html">Le fil</a><a href="evenements.html">Événements</a><a href="connexion.html">Connexion</a></div>
</div></nav>

<div class="page-pad">
  <div class="auth-card">
    <h2>Rejoins les potes 👋</h2>
    <p class="sub">Crée ton compte Jurapotes en 30 secondes.</p>
    <div id="err" class="alert" style="display:none"></div>
    <div class="field">
      <label for="name">Nom & prénom</label>
      <input id="name" type="text" placeholder="Marie Lovis" autocomplete="name">
    </div>
    <div class="field">
      <label for="town">Ta commune jurassienne</label>
      <select id="town">
        <option value="">Choisis…</option>
        <option>Delémont</option><option>Porrentruy</option><option>Saignelégier</option>
        <option>Bassecourt</option><option>Courrendlin</option><option>Le Noirmont</option>
        <option>Les Bois</option><option>Courroux</option><option>Alle</option>
        <option>Châtenois</option><option>Vicques</option><option>Autre commune du Jura</option>
      </select>
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="toi@email.ch" autocomplete="email">
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <!-- piège anti-bot : invisible aux humains, rempli par les robots -->
    <input id="hp_site" name="site_web" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div id="cfTurnstile" style="margin:6px 0"></div>
    <button class="btn btn-primary btn-block" id="go">Créer mon compte</button>
    <div class="auth-foot">Déjà un compte ? <a href="connexion.html">Se connecter</a></div>
  </div>
</div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=100"></script>
<script>
  (async()=>{ await JP.loadMe(); if(JP.user()) location.href='fil.html'; })();
  JP.fillCommuneSelect(document.getElementById('town'), {first:'Choisis ta commune…'});
  const err=document.getElementById('err');
  function showErr(m){err.textContent=m;err.style.display='block';err.style.background='var(--rouge-soft)';err.style.color='var(--rouge-dark)';}
  function showOk(m){err.textContent=m;err.style.display='block';err.style.background='#E6F4EA';err.style.color='#1E5631';}

  /* ---- Anti-bot : honeypot + délai mini + Turnstile (si configuré) ---- */
  const formLoadedAt = Date.now();
  let cfToken = '';
  const CF_KEY = (window.JP_CONFIG && JP_CONFIG.TURNSTILE_SITEKEY) || '';
  if(CF_KEY){
    window.onCfVerify = t => { cfToken = t; };
    const s=document.createElement('script');
    s.src='https://challenges.cloudflare.com/turnstile/v0/api.js'; s.async=true; s.defer=true;
    document.head.appendChild(s);
    const box=document.getElementById('cfTurnstile');
    box.className='cf-turnstile';
    box.setAttribute('data-sitekey', CF_KEY);
    box.setAttribute('data-callback', 'onCfVerify');
  }

  const btn=document.getElementById('go');
  btn.addEventListener('click',async()=>{
    const name=document.getElementById('name').value.trim();
    const town=document.getElementById('town').value;
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    // pièges anti-bot
    if(document.getElementById('hp_site').value){ return; }                 // honeypot rempli = bot
    if(Date.now()-formLoadedAt < 2500){ return showErr("Petite seconde… réessaie 🙂"); } // trop rapide
    if(!name) return showErr("Indique ton nom.");
    if(!town) return showErr("Choisis ta commune.");
    if(!/^\S+@\S+\.\S+$/.test(email)) return showErr("E-mail invalide.");
    if(password.length<6) return showErr("Mot de passe trop court (min. 6 caractères).");
    if(CF_KEY && !cfToken) return showErr("Confirme que tu n'es pas un robot 🤖");
    btn.disabled=true; btn.textContent='Création…';
    const r=await JP.register({name,town,email,password,captchaToken:cfToken||undefined});
    btn.disabled=false; btn.textContent='Créer mon compte';
    if(!r.ok){ if(window.turnstile&&CF_KEY){ try{turnstile.reset();}catch(e){} cfToken=''; } return showErr(r.msg); }
    if(r.confirm){ showOk("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi."); return; }
    location.href='fil.html';
  });
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
</script>
<script src="/assets/pwa.js?v=21"></script>
</body>
</html>
