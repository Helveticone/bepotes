<div class="page-pad"><div class="narrow">
  <h1 style="font-size:2rem;margin-bottom:8px">Mes amis</h1>

  <section id="reqSection" style="margin:24px 0;display:none">
    <h2 style="font-size:1.2rem;margin-bottom:14px">Demandes reçues <span id="reqBadge" style="background:var(--rouge);color:#fff;border-radius:999px;font-size:.8rem;padding:2px 9px;margin-left:4px"></span></h2>
    <div id="requests"></div>
  </section>

  <section style="margin-top:24px">
    <h2 style="font-size:1.2rem;margin-bottom:14px">Tes amis</h2>
    <div id="friends"></div>
  </section>
</div></div>

<script src="/assets/supabase.min.js?v=18"></script>

<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  async function render(){
    // Demandes reçues
    const reqs=await JP.pendingRequests();
    const reqSection=document.getElementById('reqSection');
    if(reqs.length){
      reqSection.style.display='block';
      document.getElementById('reqBadge').textContent=reqs.length;
      document.getElementById('requests').innerHTML=reqs.map(r=>`
        <div class="result-member" data-id="${r.id}">
          <a href="membre.html?id=${r.userId}" style="text-decoration:none">${JP.avatarHTML(r.name,r.avatar,'av')}</a>
          <div class="ri"><b><a href="membre.html?id=${r.userId}" style="color:inherit;text-decoration:none">${JP.esc(r.name)}</a></b><span>📍 ${JP.esc(r.town||'Jura')}</span></div>
          <div class="ra">
            <button class="btn btn-primary btn-sm accept" data-fid="${r.id}">Accepter</button>
            <button class="btn btn-ghost btn-sm decline" data-fid="${r.id}">Refuser</button>
          </div>
        </div>`).join('');
      document.querySelectorAll('.accept').forEach(b=>b.addEventListener('click',async()=>{
        await JP.acceptFriend(b.dataset.fid); JP.toast('Vous êtes amis ! 🎉'); await render();
      }));
      document.querySelectorAll('.decline').forEach(b=>b.addEventListener('click',async()=>{
        await JP.removeFriend(b.dataset.fid); JP.toast('Demande refusée'); await render();
      }));
    } else {
      reqSection.style.display='none';
    }

    // Liste d'amis
    const fr=await JP.friends();
    const wrap=document.getElementById('friends');
    if(!fr.length){
      wrap.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>Tu n\'as pas encore d\'amis. Va sur le fil ou la recherche pour en ajouter !</p></div>';
      return;
    }
    wrap.innerHTML=fr.map(f=>`
      <div class="result-member">
        <a href="membre.html?id=${f.id}" style="text-decoration:none">${JP.avatarHTML(f.name,f.avatar,'av')}</a>
        <div class="ri"><b><a href="membre.html?id=${f.id}" style="color:inherit;text-decoration:none">${JP.esc(f.name)}</a></b><span>📍 ${JP.esc(f.town||'Jura')}</span></div>
        <div class="ra">
          <a href="messages.html?to=${f.id}" class="btn btn-ghost btn-sm">✉ <span class="lbl">Message</span></a>
          <button class="btn btn-ghost btn-sm rm" data-fid="${f.friendshipId}">Retirer</button>
        </div>
      </div>`).join('');
    document.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',async()=>{
      if(confirm('Retirer cet ami ?')){ await JP.removeFriend(b.dataset.fid); JP.toast('Ami retiré'); await render(); }
    }));
  }

  await render();
})();
</script>
