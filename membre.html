<div class="page-pad"><div class="narrow">
  <div id="header"></div>
  <div class="profile-tabs">
    <button class="active" data-tab="posts">Publications</button>
    <button data-tab="photos">Photos</button>
    <button data-tab="albums">Albums</button>
  </div>

  <div id="photos" style="display:none"></div>
  <div id="albums" style="display:none"></div>
</div></div>

<div class="modal-bg" id="albumModal">
  <div class="modal">
    <div class="modal-head"><h3 id="albumTitle">Album</h3><button class="x" id="albumClose">&times;</button></div>
    <div class="modal-body" id="albumBody"></div>
  </div>

<div class="lightbox" id="lightbox"><button class="lb-close">&times;</button><img id="lbImg" alt=""></div>

<script src="assets/bell.js?v=22"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const userId=new URLSearchParams(location.search).get('id');
  if(!userId){ location.href='fil.html'; return; }
  // Si c'est moi, rediriger vers ma page profil éditable
  if(userId===me.id){ location.href='profil.html'; return; }

  const prof=await JP.publicProfile(userId);
  if(!prof){ document.getElementById('header').innerHTML='<div class="empty"><p>Membre introuvable.</p></div>'; return; }

  async function renderHeader(){
    const fc=await JP.followCounts(userId);
    const friendN=await JP.friendCount(userId);
    const fst=await JP.friendStatus(userId);
    const following=await JP.isFollowing(userId);
    const cover = prof.cover ? `style="background-image:url(${prof.cover});background-size:cover;background-position:center"` : '';

    let friendBtn='';
    if(fst.status==='friends') friendBtn='<button class="btn btn-primary btn-sm" id="friendBtn" data-st="friends">✓ Amis</button>';
    else if(fst.status==='pending_sent') friendBtn='<button class="btn btn-ghost btn-sm" id="friendBtn" data-st="pending_sent">Demande envoyée</button>';
    else if(fst.status==='pending_received') friendBtn='<button class="btn btn-primary btn-sm" id="friendBtn" data-st="pending_received">Accepter la demande</button>';
    else friendBtn='<button class="btn btn-primary btn-sm" id="friendBtn" data-st="none">+ Ajouter en ami</button>';

    const msgBtn = fst.status==='friends' ? `<a href="messages.html?to=${userId}" class="btn btn-ghost btn-sm">✉ Message</a>` : '';

    document.getElementById('header').innerHTML=`
      <div class="prof-head">
        <div class="prof-cover" ${cover}></div>
        <div class="prof-body">
          <div class="prof-av-wrap">${JP.avatarHTML(prof.name,prof.avatar,'av')}</div>
          <div class="prof-row">
            <div class="pinfo">
              <h1>${JP.esc(prof.name)} ${prof.is_pro?'<span style="font-size:.7em;background:var(--rouge-soft);color:var(--rouge-dark);padding:3px 10px;border-radius:999px;vertical-align:middle">Pro</span>':''}</h1>
              <div class="loc">📍 ${JP.esc(prof.town||'Jura')} · Membre depuis ${prof.joined?new Date(prof.joined).toLocaleDateString('fr-CH',{month:'long',year:'numeric'}):'récemment'}</div>
              <div class="bio ${prof.bio?'':'empty-bio'}">${prof.bio?JP.esc(prof.bio):'Pas de bio.'}</div>
              ${JP.aboutHTML(prof)}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${friendBtn}
              <button class="btn btn-ghost btn-sm" id="followBtn">${following?'✓ Suivi':'Suivre'}</button>
              ${msgBtn}
              <div class="post-menu" style="position:relative">
                <button class="dots" id="moreBtn" style="font-size:1.2rem;padding:4px 10px">⋯</button>
                <div class="pop" id="morePop">
                  <button id="reportUser">Signaler</button>
                  <button id="blockUser" class="del">Bloquer</button>
                </div>
              </div>
            </div>
          </div>
          <div class="stat-row">
            <div><b id="sPosts">0</b><span>publications</span></div>
            <div><b>${friendN}</b><span>amis</span></div>
            <div><b>${fc.followers}</b><span>abonnés</span></div>
            <div><b>${fc.following}</b><span>abonnements</span></div>
          </div>
        </div>
      </div>`;

    document.getElementById('sPosts').textContent=window._postCount||0;

    document.getElementById('friendBtn').addEventListener('click',async()=>{
      const st=await JP.friendStatus(userId);
      if(st.status==='none'){ await JP.sendFriendRequest(userId); JP.toast('Demande envoyée 👋'); }
      else if(st.status==='pending_received'){ await JP.acceptFriend(st.id); JP.toast('Vous êtes amis ! 🎉'); }
      else if(st.status==='pending_sent'){ await JP.removeFriend(st.id); JP.toast('Demande annulée'); }
      else if(st.status==='friends'){ if(confirm('Retirer cet ami ?')){ await JP.removeFriend(st.id); JP.toast('Ami retiré'); } }
      await renderHeader();
    });
    document.getElementById('followBtn').addEventListener('click',async()=>{
      if(await JP.isFollowing(userId)){ await JP.unfollow(userId); JP.toast('Désabonné'); }
      else { await JP.follow(userId); JP.toast('Abonné·e ✅'); }
      await renderHeader();
    });

    // Menu ⋯ : signaler / bloquer
    const moreBtn=document.getElementById('moreBtn');
    const morePop=document.getElementById('morePop');
    moreBtn.addEventListener('click',e=>{ e.stopPropagation(); morePop.classList.toggle('open'); });
    document.addEventListener('click',()=>morePop.classList.remove('open'));
    document.getElementById('reportUser').addEventListener('click',()=>Mod.openReport({userId}));
    document.getElementById('blockUser').addEventListener('click',async()=>{
      if(await Mod.blockUser(userId, prof.name)) location.href='fil.html';
    });
  }

  function galleryHTML(images){
    const imgs=(images||[]).filter(Boolean);
    if(!imgs.length) return '';
    const n=Math.min(imgs.length,6);
    return `<div class="post-gallery g${n}">`+imgs.slice(0,6).map(u=>`<img src="${u}" alt="" class="gimg">`).join('')+`</div>`;
  }

  async function renderPosts(){
    const ps=await JP.userPosts(userId);
    window._postCount=ps.length;
    const el=document.getElementById('sPosts'); if(el) el.textContent=ps.length;
    const wrap=document.getElementById('posts');
    if(!ps.length){ wrap.innerHTML='<div class="empty"><p>Aucune publication.</p></div>'; return; }
    wrap.innerHTML=ps.map(p=>`
      <article class="post">
        <div class="post-head">
          ${JP.avatarHTML(p.author,p.authorAvatar,'av')}
          <div class="meta"><b>${JP.esc(p.author)}</b><span>${JP.esc(p.town)} · ${JP.timeAgo(p.ts)}</span></div>
          <span class="tag">${JP.esc(p.tag)}</span>
        </div>
        <div class="post-body">${JP.esc(p.text)}</div>
        ${galleryHTML(p.images)}
        <div class="post-actions" style="border-top:1px solid var(--line);padding-top:11px;color:var(--ink-soft);font-size:.88rem;font-weight:600">
          <span style="flex:1;text-align:center">❤️ ${p.likes}</span>
          <span style="flex:1;text-align:center">💬 ${p.comments.length}</span>
        </div>
      </article>`).join('');
    wrap.querySelectorAll('.gimg').forEach(img=>img.addEventListener('click',()=>{
      document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open');
    }));
  }

  await renderPosts();
  await renderHeader();

  // Onglets Publications / Photos
  let photosLoaded=false;
  async function renderPhotos(){
    const wrap=document.getElementById('photos');
    wrap.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const ph=await JP.userPhotos(userId);
    if(!ph.length){ wrap.innerHTML='<div class="empty"><p>Aucune photo.</p></div>'; return; }
    wrap.innerHTML='<div class="photo-grid">'+ph.map(u=>`<div class="ph"><img src="${u}" alt="" loading="lazy"></div>`).join('')+'</div>';
    wrap.querySelectorAll('.ph img').forEach(img=>img.addEventListener('click',()=>{
      document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open');
    }));
  }
  /* ---- Albums (lecture seule) ---- */
  let albumsLoaded=false;
  async function renderAlbums(){
    const wrap=document.getElementById('albums');
    wrap.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const albums=await JP.listAlbums(userId);
    if(!albums.length){ wrap.innerHTML='<div class="empty"><p>Aucun album.</p></div>'; return; }
    wrap.innerHTML='<div class="album-grid">'+albums.map(a=>`<div class="album-card" data-id="${a.id}"><div class="album-cover" ${a.cover?`style="background-image:url(${a.cover})"`:''}></div><div class="album-meta"><b>${JP.esc(a.title)}</b><span>${a.count} photo${a.count>1?'s':''}</span></div></div>`).join('')+'</div>';
    wrap.querySelectorAll('.album-card[data-id]').forEach(el=>el.addEventListener('click',async()=>{
      const photos=await JP.albumPhotos(el.dataset.id);
      const body=document.getElementById('albumBody');
      document.getElementById('albumTitle').textContent=el.querySelector('b').textContent;
      body.innerHTML = photos.length ? '<div class="photo-grid">'+photos.map(p=>`<div class="ph"><img src="${p.url}" loading="lazy"></div>`).join('')+'</div>' : '<p style="color:var(--ink-soft)">Album vide.</p>';
      body.querySelectorAll('.ph img').forEach(img=>img.addEventListener('click',()=>{ document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open'); }));
      document.getElementById('albumModal').classList.add('open');
    }));
  }
  const albumModal=document.getElementById('albumModal');
  document.getElementById('albumClose').addEventListener('click',()=>albumModal.classList.remove('open'));
  albumModal.addEventListener('click',e=>{ if(e.target===albumModal) albumModal.classList.remove('open'); });

  document.querySelectorAll('.profile-tabs button').forEach(b=>b.addEventListener('click',async()=>{
    document.querySelectorAll('.profile-tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const tab=b.dataset.tab;
    document.getElementById('posts').style.display = tab==='posts'?'':'none';
    document.getElementById('photos').style.display = tab==='photos'?'':'none';
    document.getElementById('albums').style.display = tab==='albums'?'':'none';
    if(tab==='photos' && !photosLoaded){ photosLoaded=true; await renderPhotos(); }
    if(tab==='albums' && !albumsLoaded){ albumsLoaded=true; await renderAlbums(); }
  }));

  const lb=document.getElementById('lightbox');
  lb.querySelector('.lb-close').addEventListener('click',()=>lb.classList.remove('open'));
  lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.remove('open'); });
})();
</script>
