<div class="page-pad"><div class="narrow">
  <h1 style="font-family:'Fraunces',serif;margin-bottom:4px">🏆 Classement</h1>
  <p style="color:var(--ink-soft);margin-bottom:18px">Les Jurassiens les plus actifs. Publie, commente, crée des reels et reçois des j'aime pour grimper !</p>

  <div class="lb-tabs">
    <button class="active" data-period="month">Ce mois-ci</button>
    <button data-period="all">Tout temps</button>
  </div>

  <div id="hero"></div>
  <div class="lb-list" id="list"></div>
</div></div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=102"></script>
<script src="assets/nav.js?v=8"></script>
<script src="assets/bell.js?v=23"></script>
<script src="assets/calls.js?v=3"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const heroBox=document.getElementById('hero');
  const listBox=document.getElementById('list');
  const cache={};

  function href(u){ return u.user_id===me.id ? 'profil.html' : 'membre.html?id='+u.user_id; }

  function rowHTML(u, rank){
    const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':('#'+rank);
    return `<a class="lb-row ${rank<=3?'top':''}" href="${href(u)}">
      <span class="lb-rank">${medal}</span>
      ${JP.avatarHTML(u.name,u.avatar,'av')}
      <div class="lb-meta"><b>${JP.esc(u.name)}</b><span>${u.town?'📍 '+JP.esc(u.town):'&nbsp;'}</span></div>
      <span class="lb-score">${u.score} pts</span>
    </a>`;
  }

  async function render(period){
    listBox.innerHTML='<div style="padding:30px;text-align:center;color:var(--ink-soft)">Chargement…</div>';
    heroBox.innerHTML='';
    let rows=cache[period];
    if(!rows){ rows=await JP.leaderboard(period, 25); cache[period]=rows; }
    if(!rows.length){
      heroBox.innerHTML='';
      listBox.innerHTML='<div class="empty" style="text-align:center;padding:40px;color:var(--ink-soft)"><p>Pas encore de classement '+(period==='month'?'ce mois-ci':'')+'. Sois le premier à animer le Jura !</p></div>';
      return;
    }
    // « Jurassien du mois » / champion = 1er
    const champ=rows[0];
    heroBox.innerHTML=`<div class="lb-hero">
      ${JP.avatarHTML(champ.name,champ.avatar,'av')}
      <div class="lh-txt"><b>${JP.esc(champ.name)}</b><span>${period==='month'?'Jurassien du mois':'Champion all-time'} · ${champ.score} pts</span></div>
      <span class="lh-crown">👑</span>
    </div>`;
    heroBox.querySelector('.lb-hero').style.cursor='pointer';
    heroBox.querySelector('.lb-hero').addEventListener('click',()=>location.href=href(champ));
    listBox.innerHTML=rows.map((u,i)=>rowHTML(u,i+1)).join('');
  }

  document.querySelectorAll('.lb-tabs button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.lb-tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.period);
  }));

  await render('month');
})();
</script>
