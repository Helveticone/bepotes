<div class="page-pad"><div class="narrow">
  <h1 style="font-size:2rem;margin-bottom:18px">Rechercher</h1>
  <div class="field" style="margin-bottom:22px">
    <input id="q" type="text" placeholder="Un nom, une commune, un mot-clé…" autocomplete="off" autofocus>
  </div>
  <div class="search-tabs">
    <button class="active" data-tab="members">Membres</button>
    <button data-tab="groups">Groupes</button>
    <button data-tab="posts">Publications</button>
  </div>
  <div id="results"></div>
</div></div>

<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  const me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  const q=document.getElementById('q');
  const results=document.getElementById('results');
  let tab='members';

  document.querySelectorAll('.search-tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.search-tabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); tab=b.dataset.tab; run();
    });
  });

  let t;
  q.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(run, 250); });

  async function run(){
    const term=q.value.trim();
    if(term.length<1){ results.innerHTML='<p style="color:var(--ink-soft)">Tape quelque chose pour lancer la recherche.</p>'; return; }
    results.innerHTML='<p style="color:var(--ink-soft)">Recherche…</p>';
    if(tab==='members') await renderMembers(term);
    else if(tab==='groups') await renderGroups(term);
    else await renderPosts(term);
  }

  async function renderGroups(term){
    const gs=await JP.listGroups(term);
    if(!gs.length){ results.innerHTML='<div class="empty"><p>Aucun groupe trouvé pour « '+JP.esc(term)+' ».</p></div>'; return; }
    results.innerHTML=gs.map(g=>`
      <div class="result-member">
        <div class="av" style="background:${JP.colorFor(g.name)}">${JP.initials(g.name)}</div>
        <div class="ri"><b>${JP.esc(g.name)} ${g.isPrivate?'🔒':''}</b><span>📍 ${JP.esc(g.town||'Tout le Jura')} · ${g.memberCount} membre${g.memberCount>1?'s':''}</span></div>
        <div class="ra"><a href="groupe.html?id=${g.id}" class="btn btn-primary btn-sm">${g.isMember?'Ouvrir':(g.isPending?'En attente':'Voir')}</a></div>
      </div>`).join('');
  }

  async function renderMembers(term){
    const ms=await JP.members(term);
    if(!ms.length){ results.innerHTML='<div class="empty"><p>Aucun membre trouvé pour « '+JP.esc(term)+' ».</p></div>'; return; }
    results.innerHTML=ms.map(m=>`
      <div class="result-member">
        <a href="membre.html?id=${m.id}" style="text-decoration:none">${JP.avatarHTML(m.name,m.avatar,'av')}</a>
        <div class="ri"><b><a href="membre.html?id=${m.id}" style="color:inherit;text-decoration:none">${JP.esc(m.name)}</a></b><span>📍 ${JP.esc(m.town||'Jura')}</span></div>
        <div class="ra">
          <a href="membre.html?id=${m.id}" class="btn btn-ghost btn-sm">Voir le profil</a>
        </div>
      </div>`).join('');
  }

  async function renderPosts(term){
    const ps=await JP.searchPosts(term);
    if(!ps.length){ results.innerHTML='<div class="empty"><p>Aucune publication trouvée pour « '+JP.esc(term)+' ».</p></div>'; return; }
    results.innerHTML=ps.map(p=>`
      <article class="post">
        <div class="post-head">
          ${JP.avatarHTML(p.author,p.authorAvatar,'av')}
          <div class="meta"><b>${JP.esc(p.author)}</b><span>${JP.esc(p.town)} · ${JP.timeAgo(p.ts)}</span></div>
          <span class="tag">${JP.esc(p.tag)}</span>
        </div>
        <div class="post-body">${JP.esc(p.text)}</div>
        ${p.image?`<div class="post-img"><img src="${p.image}" alt=""></div>`:''}
        <div class="post-actions" style="border-top:1px solid var(--line);padding-top:11px;color:var(--ink-soft);font-size:.88rem;font-weight:600">
          <span style="flex:1;text-align:center">❤️ ${p.likes}</span>
          <span style="flex:1;text-align:center">💬 ${p.comments}</span>
        </div>
      </article>`).join('');
  }

  // pré-remplir si ?q= dans l'URL (depuis la barre de nav)
  const params=new URLSearchParams(location.search);
  if(params.get('q')){ q.value=params.get('q'); }
  run();
})();
</script>
