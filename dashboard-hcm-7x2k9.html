<style>
  .dash-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dash-sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:22px}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
  .stat .lbl{font-size:.74rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .stat .num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;line-height:1.05;margin:5px 0 3px}
  .stat .sub{font-size:.8rem;color:var(--ink-soft)}
  .stat .sub b{color:var(--rouge-dark)}
  .dash-sec{margin:32px 0}
  .dash-sec>h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.25rem;margin-bottom:14px}
  .ret-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
  .ret{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
  .ret .big{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:700;color:var(--rouge);line-height:1}
  .ret .rl{font-size:.82rem;color:var(--ink-soft);margin-top:5px;font-weight:600}
  .ret .rh{font-size:.72rem;color:var(--ink-soft);margin-top:3px}
  .chart-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .chart-card h3{font-size:.95rem;margin-bottom:10px;font-family:'Plus Jakarta Sans',sans-serif}
  .chart-wrap{position:relative;height:260px}
  .dash-table{width:100%;border-collapse:collapse;font-size:.9rem}
  .dash-table th,.dash-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  .dash-table th{color:var(--ink-soft);font-weight:700;font-size:.74rem;text-transform:uppercase}
  .dash-table td.n{text-align:right;font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:none;background:var(--white);color:var(--ink-soft);padding:6px 14px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.84rem}
  .seg button.on{background:var(--rouge);color:#fff}
  .mod-alert{background:#FEF3C7;color:#92400E;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.two-col{grid-template-columns:1fr}}
</style>

<body>
<nav><div class="wrap nav-inner">

<div class="page-pad"><div class="narrow" style="max-width:1000px">
  <div class="dash-h">
    <h1 style="font-size:2rem">Dashboard <span class="admin-badge">ADMIN</span></h1>
    <button class="btn btn-ghost btn-sm" id="refresh">↻ Rafraîchir</button>
  </div>
  <div class="dash-sub" id="updated">Chargement…</div>

  <div id="content"></div>
</div></div>

<script>
document.addEventListener("DOMContentLoaded",function(){
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  if(!JP.isAdmin()){
    document.querySelector('.narrow').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><p>Accès réservé aux administrateurs.</p><a href="fil.html" class="btn btn-primary btn-sm" style="margin-top:14px">Retour au fil</a></div>';
    return;
  }

  const content=document.getElementById('content');
  const updated=document.getElementById('updated');
  let growthDays=30, charts={};

  const nf=new Intl.NumberFormat('fr-CH');
  const n=v=>(v==null?'—':nf.format(v));
  const pct=v=>(v==null?'—':v+' %');

  // Couleurs depuis le thème (s'adaptent au mode sombre)
  function themeColors(){
    const cs=getComputedStyle(document.documentElement);
    const g=k=>cs.getPropertyValue(k).trim();
    return { rouge:g('--rouge')||'#E11D2A', ink:g('--ink')||'#1A1416', soft:g('--ink-soft')||'#897',
             line:g('--line')||'#eee', white:g('--white')||'#fff' };
  }
  function waitChart(){ return new Promise(res=>{ let t=0; (function p(){ if(window.Chart||t>40) return res(window.Chart); t++; setTimeout(p,100); })(); }); }

  const card=(lbl,num,sub)=>`<div class="stat"><div class="lbl">${lbl}</div><div class="num">${num}</div><div class="sub">${sub||''}</div></div>`;

  async function topTownsFallback(){
    const sb=JP.sb;
    const [pr,po]=await Promise.all([ sb.from('profiles').select('town'), sb.from('posts').select('town') ]);
    const u={}, p={};
    (pr.data||[]).forEach(r=>{ const t=(r.town||'').trim(); if(t) u[t]=(u[t]||0)+1; });
    (po.data||[]).forEach(r=>{ const t=(r.town||'').trim(); if(t) p[t]=(p[t]||0)+1; });
    const all=new Set([...Object.keys(u),...Object.keys(p)]);
    return [...all].map(t=>({ town:t, users:u[t]||0, posts:p[t]||0 }))
      .sort((a,b)=> (b.users-a.users) || (b.posts-a.posts)).slice(0,15);
  }

  async function load(){
    updated.textContent='Chargement…';
    const [ov,gr,re,tw,bz,mo,er,ads,acq,pst,eng,hrs]=await Promise.allSettled([
      JP.adminOverview(), JP.adminGrowth(growthDays), JP.adminRetention(),
      JP.adminTopTowns(), JP.adminBusiness(), JP.adminModeration(), JP.adminErrors(40),
      JP.adminAdsActive ? JP.adminAdsActive() : Promise.resolve(0),
      JP.adminAcquisition(growthDays), JP.adminPagesStatus(), JP.adminEngagement(30), JP.adminActivityByHour()
    ]);
    const val=r=>r.status==='fulfilled'?r.value:null;
    // Top communes : repli côté client si la RPC renvoie vide (agrège profils + posts par commune)
    let towns = val(tw);
    if(!towns || !towns.length){ try{ towns = await topTownsFallback(); }catch(e){ towns = towns||[]; } }
    render(val(ov), val(gr), val(re), towns, val(bz), val(mo), val(er), val(ads)||0, val(acq), val(pst), val(eng), val(hrs));
    if(ov.status==='rejected') console.error(ov.reason);
    updated.textContent='Dernière mise à jour : '+new Date().toLocaleString('fr-CH',{dateStyle:'short',timeStyle:'short'});
  }

  function render(o, g, r, towns, bz, mo, errs, adsActive, acq, pst, eng, hrs){
    o=o||{}; r=r||{}; bz=bz||{}; errs=errs||[]; adsActive=adsActive||0;
    content.innerHTML=`
    <div class="dash-sec">
      <h2>Vue d'ensemble</h2>
      <div class="dash-grid">
        ${card('Comptes', n(o.users_total), `<b>+${n(o.users_today)}</b> aujourd'hui · +${n(o.users_7d)} / 7 j`)}
        ${card('Actifs', n(o.active_7d)+' <span style="font-size:.6em;color:var(--ink-soft)">/7j</span>', `${n(o.active_today)} aujourd'hui · ${n(o.active_30d)} / 30 j`)}
        ${card('Publications', n(o.posts_total), `<b>+${n(o.posts_today)}</b> aujourd'hui · +${n(o.posts_7d)} / 7 j`)}
        ${card('Reels', n(o.reels_total), `+${n(o.reels_7d)} / 7 j`)}
        ${card('Commentaires', n(o.comments_total), `+${n(o.comments_7d)} / 7 j`)}
        ${card('Réactions', n(o.likes_total), `+${n(o.likes_7d)} / 7 j`)}
        ${card('Groupes', n(o.groups_total), `+${n(o.groups_7d)} / 7 j`)}
        ${card('Pages établ.', n(o.pages_total), `+${n(o.pages_7d)} / 7 j`)}
        ${card('Pub active (régie)', n(adsActive), 'Publicités en ligne')}
        ${card('Annonces Marché', n(o.listings_active), 'Petites annonces actives')}
        ${card('Événements', n(o.events_total), `${n(o.events_upcoming)} à venir`)}
        ${card('Messages /7j', n(o.messages_7d), 'Volume messagerie')}
      </div>
    </div>

    <div class="dash-sec">
      <div class="dash-h"><h2>Croissance</h2>
        <div class="seg" id="seg">
          <button data-d="7" ${growthDays==7?'class="on"':''}>7 j</button>
          <button data-d="30" ${growthDays==30?'class="on"':''}>30 j</button>
          <button data-d="90" ${growthDays==90?'class="on"':''}>90 j</button>
        </div>
      </div>
      <div class="two-col">
        <div class="chart-card"><h3>Activité & contenu / jour</h3><div class="chart-wrap"><canvas id="chActivity"></canvas></div></div>
        <div class="chart-card"><h3>Cumul des comptes</h3><div class="chart-wrap"><canvas id="chCumul"></canvas></div></div>
      </div>
    </div>

    <div class="dash-sec">
      <h2>Acquisition &amp; engagement</h2>
      <div class="two-col">
        <div class="chart-card"><h3>D'où viennent les inscrits (${growthDays} j)</h3><div class="chart-wrap"><canvas id="chAcq"></canvas></div></div>
        <div class="chart-card"><h3>Engagement — 30 j</h3><div class="chart-wrap"><canvas id="chEngage"></canvas></div></div>
      </div>
      <div class="two-col">
        <div class="chart-card"><h3>Audience par heure (7 j, Europe/Zurich)</h3><div class="chart-wrap"><canvas id="chHours"></canvas></div></div>
        <div class="chart-card"><h3>Pages établissements</h3>
          <div class="dash-grid">
            ${card('Créées', n(pst&&pst.pages_total), `+${n(pst&&pst.pages_7d)} / 7 j · +${n(pst&&pst.pages_30d)} / 30 j`)}
            ${card('Actives', n(pst&&pst.active_30d), '≥ 1 post sur 30 j')}
            ${card('Dormantes', n(pst?(pst.pages_total||0)-(pst.active_30d||0):null), 'aucun post récent')}
            ${card('Avis', n(pst&&pst.reviews_total), `+${n(pst&&pst.reviews_30d)} / 30 j`)}
          </div>
          <p style="font-size:.75rem;color:var(--ink-soft);margin-top:8px">« Active » = page avec ≥ 1 publication sur les 30 derniers jours.</p>
        </div>
      </div>
    </div>

    <div class="dash-sec">
      <h2>Rétention <span style="font-size:.6em;color:var(--ink-soft);font-weight:400">— la métrique reine</span></h2>
      <div class="ret-grid">
        <div class="ret"><div class="big">${pct(r.ratio_active)}</div><div class="rl">Actifs / inscrits</div><div class="rh">actifs 7 j ÷ total</div></div>
        <div class="ret"><div class="big">${pct(r.j1)}</div><div class="rl">Retour J+1</div><div class="rh">revenus après le 1er jour</div></div>
        <div class="ret"><div class="big">${pct(r.j7)}</div><div class="rl">Retour J+7</div><div class="rh">encore là ~1 semaine</div></div>
        <div class="ret"><div class="big">${pct(r.j30)}</div><div class="rl">Retour J+30</div><div class="rh">encore là ~1 mois</div></div>
      </div>
    </div>

    <div class="two-col">
      <div class="dash-sec">
        <h2>Top communes</h2>
        <table class="dash-table"><thead><tr><th>Commune</th><th class="n">Membres</th><th class="n">Posts</th></tr></thead>
        <tbody>${(towns&&towns.length)?towns.map(t=>`<tr><td>${JP.esc(t.town)}</td><td class="n">${n(t.users)}</td><td class="n">${n(t.posts)}</td></tr>`).join(''):'<tr><td colspan="3" style="color:var(--ink-soft)">—</td></tr>'}</tbody></table>
      </div>

      <div class="dash-sec">
        <h2>Business / commerces</h2>
        <div class="dash-grid">
          ${card('Pages établ.', n(bz.pages_total), `+${n(bz.pages_7d)} / 7 j`)}
          ${card('Pages actives', n(bz.pages_active), `dormantes : ${n((bz.pages_total||0)-(bz.pages_active||0))}`)}
          ${card('Avis', n(bz.reviews_total), `note moy. ${bz.reviews_avg!=null?bz.reviews_avg+' ★':'—'}`)}
          ${card('Premium', '—', 'à venir (abonnements)')}
        </div>
      </div>
    </div>

    <div class="dash-sec">
      <h2>Modération</h2>
      ${(mo&&mo.reports_open>0 && (mo.reports_oldest_days||0)>=2)?`<div class="mod-alert">⚠️ ${n(mo.reports_open)} signalement(s) en attente — le plus ancien depuis ${n(mo.reports_oldest_days)} jour(s).</div>`:''}
      <div class="dash-grid">
        ${card('Signalements à traiter', n(mo?mo.reports_open:null), `<a href="panneau-hcm-7x2k9.html" style="color:var(--rouge)">Ouvrir la modération →</a>`)}
        ${card('Signalements traités', n(mo?mo.reports_done:null), '')}
        ${card("File d'attente (mots)", n(mo?mo.queue_open:null), 'auto-détection')}
      </div>
    </div>

    <div class="dash-sec">
      <h2>Erreurs récentes ${errs.length?`<span style="font-size:.6em;color:var(--rouge)">(${errs.length})</span>`:''}</h2>
      ${errs.length ? `<table class="dash-table"><thead><tr><th>Quand</th><th>Page</th><th>Erreur</th><th>Membre</th></tr></thead><tbody>`+
        errs.map(e=>`<tr><td>${new Date(e.ts).toLocaleString('fr-CH',{dateStyle:'short',timeStyle:'short'})}</td><td>${JP.esc(e.source||'')}</td><td style="max-width:340px"><span title="${JP.esc(e.detail||'')}">${JP.esc((e.message||'').slice(0,120))}</span></td><td>${JP.esc(e.who||'—')}</td></tr>`).join('')+
        `</tbody></table>` : '<div class="empty"><p>Aucune erreur signalée 🎉</p></div>'}
    </div>`;

    // Sélecteur de période
    const seg=document.getElementById('seg');
    if(seg) seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{
      growthDays=+b.dataset.d; await load();
    }));

    drawCharts(g);
    drawExtraCharts(acq, eng, hrs);
  }

  async function drawCharts(g){
    if(!g || !g.length) return;
    const C=await waitChart();
    if(!C){ document.querySelectorAll('.chart-wrap').forEach(w=>w.innerHTML='<p style="color:var(--ink-soft);font-size:.85rem">Graphique indisponible (CDN). Réessaie.</p>'); return; }
    const t=themeColors();
    C.defaults.color=t.soft; C.defaults.borderColor=t.line; C.defaults.font.family="'Plus Jakarta Sans',sans-serif";
    const labels=g.map(d=>{ const dt=new Date(d.day); return dt.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit'}); });
    const line=(id,sets)=>{
      const el=document.getElementById(id); if(!el) return;
      if(charts[id]) charts[id].destroy();
      charts[id]=new C(el,{ type:'line',
        data:{ labels, datasets:sets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:sets.length>1, labels:{boxWidth:12} } },
          scales:{ x:{ grid:{display:false} }, y:{ beginAtZero:true, ticks:{precision:0}, grid:{color:t.line} } },
          elements:{ line:{ tension:.3 }, point:{ radius:0, hitRadius:8 } } }
      });
    };
    line('chActivity',[
      { label:'Actifs', data:g.map(d=>d.active_users), borderColor:t.rouge, backgroundColor:'transparent', borderWidth:2.5 },
      { label:'Nouveaux comptes', data:g.map(d=>d.new_users), borderColor:'#2d7dd2', backgroundColor:'transparent', borderWidth:2 },
      { label:'Publications', data:g.map(d=>d.posts), borderColor:'#22a06b', backgroundColor:'transparent', borderWidth:2 }
    ]);
    // Cumul comptes : base = total actuel - somme des nouveaux de la fenêtre
    const ov = await JP.adminOverview().catch(()=>({}));
    const sumNew=g.reduce((a,d)=>a+(d.new_users||0),0);
    let run=(ov.users_total||sumNew)-sumNew, cumul=g.map(d=>(run+=(d.new_users||0)));
    line('chCumul',[{ label:'Comptes (cumul)', data:cumul, borderColor:t.rouge, backgroundColor:'rgba(225,29,42,.10)', borderWidth:2.5, fill:true }]);
  }

  async function drawExtraCharts(acq, eng, hrs){
    const C=await waitChart(); if(!C) return; const t=themeColors();
    C.defaults.color=t.soft; C.defaults.borderColor=t.line; C.defaults.font.family="'Plus Jakarta Sans',sans-serif";
    const bar=(id,labels,data)=>{ const el=document.getElementById(id); if(!el) return;
      if(charts[id]) charts[id].destroy();
      charts[id]=new C(el,{type:"bar",data:{labels,datasets:[{data,backgroundColor:t.rouge,borderRadius:6}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0},grid:{color:t.line}}}}}); };
    // Acquisition (barres horizontales par source)
    if(acq&&acq.length){ const el=document.getElementById("chAcq"); if(el){ if(charts.chAcq)charts.chAcq.destroy();
      charts.chAcq=new C(el,{type:"bar",data:{labels:acq.map(x=>x.source),datasets:[{data:acq.map(x=>x.signups),backgroundColor:t.rouge,borderRadius:6}]},
        options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:{beginAtZero:true,ticks:{precision:0},grid:{color:t.line}},y:{grid:{display:false}}}}}); } }
    // Engagement (doughnut)
    if(eng){ const el=document.getElementById("chEngage"); if(el){ if(charts.chEngage)charts.chEngage.destroy();
      charts.chEngage=new C(el,{type:"doughnut",
        data:{labels:["Créateurs","Engagés","Lurkers"],datasets:[{data:[eng.creators||0,eng.engagers||0,eng.lurkers||0],backgroundColor:["#22a06b","#2d7dd2","#cbcbcb"]}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12}}}}}); } }
    // Audience par heure (0-23, trous à 0)
    if(hrs){ const map={}; hrs.forEach(x=>map[x.heure]=x.evenements);
      bar("chHours", Array.from({length:24},(_,h)=>h+"h"), Array.from({length:24},(_,h)=>map[h]||0)); }
  }


  document.getElementById('refresh').addEventListener('click',load);
  await load();
})();

});
</script>
