<div class="page-pad"><div class="narrow">

  <div class="prof-head">
    <div class="prof-cover" id="cover">
      <button class="cover-edit" id="coverBtn">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Modifier la couverture
      </button>
    </div>
    <div class="prof-body">
      <div class="prof-av-wrap">
        <div id="avBox"></div>
        <button class="av-edit" id="avBtn" title="Changer la photo">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </div>
      <div class="prof-row">
        <div class="pinfo">
          <h1 id="name"></h1>
          <div class="loc" id="loc"></div>
          <div class="bio" id="bio"></div>
          <div class="about" id="about"></div>
        </div>
        <div class="edit-profile-btn" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="editBtn">Modifier le profil</button>
          <a class="btn btn-ghost btn-sm" href="parametres.html" title="Paramètres">⚙️ Paramètres</a>
        </div>
      </div>
      <div class="stat-row">
        <div><b id="sPosts">0</b><span>publications</span></div>
        <div><b id="sFriends">0</b><span>amis</span></div>
        <div><b id="sFollowers">0</b><span>abonnés</span></div>
        <div><b id="sFollowing">0</b><span>abonnements</span></div>
        <div><b id="sLikes">0</b><span>j'aime reçus</span></div>
      </div>
      <div id="rep"></div>
    </div>
  </div>

  <div class="profile-tabs">
    <button class="active" data-tab="posts">Publications</button>
    <button data-tab="photos">Photos</button>
    <button data-tab="albums">Albums</button>
  </div>
  <div id="mine"></div>
  <div id="photos" style="display:none"></div>
  <div id="albums" style="display:none"></div>

  <div id="blockedSection" style="display:none;margin-top:32px">
    <h2 style="font-size:1.4rem;margin-bottom:16px">Membres bloqués</h2>
    <div id="blockedList"></div>
  </div>
</div></div>

<!-- Inputs fichiers cachés -->
<input type="file" id="coverFile" accept="image/*" style="display:none">
<input type="file" id="avFile" accept="image/*" style="display:none">

<!-- Modale édition profil -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head"><h3>Modifier le profil</h3><button class="x" id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field">
        <label for="mName">Nom</label>
        <input id="mName" type="text" maxlength="40">
      </div>
      <div class="field">
        <label for="mTown">Commune</label>
        <select id="mTown">
          <option>Delémont</option><option>Porrentruy</option><option>Saignelégier</option>
          <option>Bassecourt</option><option>Courrendlin</option><option>Le Noirmont</option>
          <option>Les Bois</option><option>Courroux</option><option>Alle</option>
          <option>Châtenois</option><option>Vicques</option><option>Autre commune du Jura</option>
        </select>
      </div>
      <div class="field">
        <label for="mBio">Bio</label>
        <textarea id="mBio" maxlength="200" placeholder="Parle un peu de toi… (passions, quartier, métier)"></textarea>
        <div class="count-hint"><span id="bioCount">0</span>/200</div>
      </div>
      <div class="field"><label for="mJob">Métier / activité</label><input id="mJob" type="text" maxlength="60" placeholder="Ex. Menuisier, étudiante, retraité·e…"></div>
      <div class="field"><label for="mSchool">Formation / études</label><input id="mSchool" type="text" maxlength="80" placeholder="Ex. Lycée cantonal, CFC menuisier…"></div>
      <div class="field"><label for="mRel">Situation amoureuse</label>
        <select id="mRel">
          <option value="">— Non précisée —</option>
          <option>Célibataire</option><option>En couple</option><option>Fiancé·e</option><option>Marié·e</option><option>C'est compliqué</option>
        </select>
      </div>
      <div class="field"><label for="mBirthday">Anniversaire</label><input id="mBirthday" type="date">
        <label style="display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:6px;cursor:pointer"><input type="checkbox" id="mShowYear"> Afficher l'année</label>
      </div>
      <div class="field"><label for="mOrigin">Commune d'origine</label><select id="mOrigin"></select></div>
      <div class="field"><label for="mWebsite">Site / lien (optionnel)</label><input id="mWebsite" type="text" maxlength="120" placeholder="https://…"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="mCancel">Annuler</button>
      <button class="btn btn-primary btn-sm" id="mSave">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modale album -->
<div class="modal-bg" id="albumModal">
  <div class="modal">
    <div class="modal-head"><h3 id="alTitle">Album</h3><button class="x" id="alClose">&times;</button></div>
    <div class="modal-body" id="alBody"></div>
    <div class="modal-foot" id="alFoot"></div>
  </div>
</div>
<input type="file" id="albumFile" accept="image/*" multiple style="display:none">

<div class="lightbox" id="lightbox"><button class="lb-close">&times;</button><img id="lbImg" alt=""></div>

<script src="/assets/supabase.min.js?v=18"></script>
<script src="assets/config.js"></script>
<script src="assets/app.supabase.js?v=99"></script>
<script src="assets/nav.js?v=8"></script>
<script src="assets/bell.js?v=23"></script>
<script src="assets/calls.js?v=3"></script>
<script>
(async function(){
  const okAuth = await JP.requireAuth();
  if(!okAuth) return;
  let me=JP.user();
  document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();JP.logout();});

  let myPosts=[];

  async function loadData(){
    const all=await JP.posts();
    myPosts=all.filter(p=>p.authorEmail===me.id);
    const counts=await JP.followCounts(me.id);
    document.getElementById('sFollowers').textContent=counts.followers;
    document.getElementById('sFollowing').textContent=counts.following;
    document.getElementById('sFriends').textContent=await JP.friendCount(me.id);
  }

  function paint(){
    me=JP.user();
    document.getElementById('avBox').innerHTML=JP.avatarHTML(me.name, me.avatar, 'av');
    const cover=document.getElementById('cover');
    if(me.cover){ cover.style.backgroundImage=`url(${me.cover})`; cover.style.backgroundSize='cover'; cover.style.backgroundPosition='center'; }
    else { cover.style.backgroundImage='linear-gradient(120deg,var(--rouge),#F2723B)'; }
    document.getElementById('name').textContent=me.name;
    const since = me.joined ? new Date(me.joined).toLocaleDateString('fr-CH',{month:'long',year:'numeric'}) : 'récemment';
    document.getElementById('loc').textContent='📍 '+(me.town||'')+' · Membre depuis '+since;
    const bio=document.getElementById('bio');
    if(me.bio){ bio.textContent=me.bio; bio.classList.remove('empty-bio'); }
    else { bio.textContent="Aucune bio pour l'instant. Clique sur « Modifier le profil » pour te présenter."; bio.classList.add('empty-bio'); }
    document.getElementById('about').innerHTML=JP.aboutHTML(me);
    JP.userStats(me.id).then(s=>{ const el=document.getElementById('rep'); if(el && s) el.innerHTML=JP.reputationHTML(s); });
    document.getElementById('sPosts').textContent=myPosts.length;
    document.getElementById('sLikes').textContent=myPosts.reduce((s,p)=>s+p.likes,0);
    renderMine(myPosts);
  }

  function renderMine(mine){
    const wrap=document.getElementById('mine');
    if(!mine.length){
      wrap.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><p>Tu n\'as encore rien publié. <a href="fil.html" style="color:var(--rouge);font-weight:600">Lance-toi sur le fil →</a></p></div>';
      return;
    }
    wrap.innerHTML=mine.map(p=>`
      <article class="post">
        <div class="post-head">
          ${JP.avatarHTML(p.author,p.authorAvatar,'av')}
          <div class="meta"><b>${JP.esc(p.author)}</b><span>${JP.esc(p.town)} · ${JP.timeAgo(p.ts)}</span></div>
          <span class="tag">${JP.esc(p.tag)}</span>
        </div>
        <div class="post-body">${JP.esc(p.text)}</div>
        ${p.image?`<div class="post-img"><img src="${p.image}" alt=""></div>`:''}
        <div class="post-actions" style="border-top:1px solid var(--line);padding-top:11px;color:var(--ink-soft);font-size:.88rem;font-weight:600">
          <span style="flex:1;text-align:center">❤️ ${p.likes} j'aime</span>
          <span style="flex:1;text-align:center">💬 ${p.comments.length} commentaires</span>
        </div>
      </article>`).join('');
  }

  /* ---- Upload couverture (vers Supabase Storage) ---- */
  const coverFile=document.getElementById('coverFile');
  document.getElementById('coverBtn').addEventListener('click',()=>coverFile.click());
  coverFile.addEventListener('change',async e=>{
    const f=e.target.files[0]; coverFile.value=''; if(!f) return;
    const blob=await JP.cropImage(f,{aspect:2.7,round:false,outW:1600,title:'Repositionne ta couverture'});
    if(!blob) return;
    JP.toast('Envoi de la couverture…');
    try{
      const url=await JP.uploadBlob('covers', blob);
      const r=await JP.updateProfile({cover:url});
      if(r.ok){ JP.toast('Couverture mise à jour ✨'); paint(); }
      else JP.toast(r.msg||'Échec de la mise à jour');
    }catch(err){ console.error(err); JP.toast('Échec de l\'envoi — réessaie'); }
  });

  /* ---- Upload avatar (vers Supabase Storage) ---- */
  const avFile=document.getElementById('avFile');
  document.getElementById('avBtn').addEventListener('click',()=>avFile.click());
  avFile.addEventListener('change',async e=>{
    const f=e.target.files[0]; avFile.value=''; if(!f) return;
    const blob=await JP.cropImage(f,{aspect:1,round:true,outW:512,title:'Repositionne ta photo de profil'});
    if(!blob) return;
    JP.toast('Envoi de la photo…');
    try{
      const url=await JP.uploadBlob('avatars', blob);
      const r=await JP.updateProfile({avatar:url});
      if(r.ok){ JP.toast('Photo de profil mise à jour 📸'); paint(); }
      else JP.toast(r.msg||'Échec de la mise à jour');
    }catch(err){ console.error(err); JP.toast('Échec de l\'envoi — réessaie'); }
  });

  /* ---- Modale édition ---- */
  const modal=document.getElementById('modal');
  const openM=()=>{ document.getElementById('mName').value=me.name;
    JP.fillCommuneSelect(document.getElementById('mTown'), {selected: me.town||'Delémont'});
    JP.fillCommuneSelect(document.getElementById('mOrigin'), {first:'Non précisée', selected: me.origin||''});
    document.getElementById('mBio').value=me.bio||'';
    document.getElementById('mJob').value=me.job||'';
    document.getElementById('mSchool').value=me.school||'';
    document.getElementById('mRel').value=me.relationship||'';
    document.getElementById('mBirthday').value=me.birthday||'';
    document.getElementById('mShowYear').checked=!!me.show_birth_year;
    document.getElementById('mWebsite').value=me.website||'';
    document.getElementById('bioCount').textContent=(me.bio||'').length;
    modal.classList.add('open'); };
  const closeM=()=>modal.classList.remove('open');
  document.getElementById('editBtn').addEventListener('click',openM);
  document.getElementById('mClose').addEventListener('click',closeM);
  document.getElementById('mCancel').addEventListener('click',closeM);
  modal.addEventListener('click',e=>{if(e.target===modal)closeM();});
  document.getElementById('mBio').addEventListener('input',e=>{
    document.getElementById('bioCount').textContent=e.target.value.length;});
  document.getElementById('mSave').addEventListener('click',async()=>{
    const name=document.getElementById('mName').value.trim();
    if(!name){JP.toast('Le nom ne peut pas être vide');return;}
    const r=await JP.updateProfile({name, town:document.getElementById('mTown').value, bio:document.getElementById('mBio').value.trim(),
      job:document.getElementById('mJob').value.trim(), origin:document.getElementById('mOrigin').value||'', website:document.getElementById('mWebsite').value.trim(),
      school:document.getElementById('mSchool').value.trim(), relationship:document.getElementById('mRel').value||'',
      birthday:document.getElementById('mBirthday').value||null, show_birth_year:document.getElementById('mShowYear').checked});
    if(r.ok){ JP.toast('Profil enregistré ✅'); closeM(); paint(); }
    else JP.toast(r.msg||'Échec de l\'enregistrement');
  });

  await loadData();
  paint();

  // Onglets Publications / Photos
  const meId=JP.user().id;
  let photosLoaded=false;
  async function renderPhotos(){
    const wrap=document.getElementById('photos');
    wrap.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const ph=await JP.userPhotos(meId);
    if(!ph.length){ wrap.innerHTML='<div class="empty"><p>Aucune photo pour l\'instant. Ajoute des photos à tes publications !</p></div>'; return; }
    wrap.innerHTML='<div class="photo-grid">'+ph.map(u=>`<div class="ph"><img src="${u}" alt="" loading="lazy"></div>`).join('')+'</div>';
    wrap.querySelectorAll('.ph img').forEach(img=>img.addEventListener('click',()=>{
      document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open');
    }));
  }
  /* ---- Albums ---- */
  let albumsLoaded=false, albumTarget=null;
  const albumModal=document.getElementById('albumModal');
  const albumFile=document.getElementById('albumFile');
  document.getElementById('alClose').addEventListener('click',()=>albumModal.classList.remove('open'));
  albumModal.addEventListener('click',e=>{ if(e.target===albumModal) albumModal.classList.remove('open'); });

  async function renderAlbums(){
    const wrap=document.getElementById('albums');
    wrap.innerHTML='<p style="color:var(--ink-soft)">Chargement…</p>';
    const albums=await JP.listAlbums(meId);
    wrap.innerHTML='<div class="album-grid">'+
      '<button class="album-card album-new" id="newAlbum" type="button"><div class="album-cover plus">+</div><div class="album-meta"><b>Créer un album</b></div></button>'+
      albums.map(a=>`<div class="album-card" data-id="${a.id}"><div class="album-cover" ${a.cover?`style="background-image:url(${a.cover})"`:''}></div><div class="album-meta"><b>${JP.esc(a.title)}</b><span>${a.count} photo${a.count>1?'s':''}</span></div></div>`).join('')+
      '</div>';
    document.getElementById('newAlbum').addEventListener('click',createAlbumFlow);
    wrap.querySelectorAll('.album-card[data-id]').forEach(el=>el.addEventListener('click',()=>openAlbum(el.dataset.id)));
  }
  async function createAlbumFlow(){
    const title=(prompt('Nom de l\'album :','')||'').trim(); if(!title) return;
    const r=await JP.createAlbum(title);
    if(!r.ok){ JP.toast(r.msg||'Échec'); return; }
    JP.toast('Album créé ✅'); albumTarget=r.id; albumFile.click();
    await renderAlbums();
  }
  albumFile.addEventListener('change',async()=>{
    const files=[...albumFile.files]; albumFile.value='';
    if(!files.length || !albumTarget) return;
    JP.toast('Téléversement…');
    const r=await JP.addAlbumPhotos(albumTarget, files);
    JP.toast(r.ok?(r.added+' photo(s) ajoutée(s) 📷'):(r.msg||'Échec'));
    await renderAlbums();
    if(albumModal.classList.contains('open')) openAlbum(albumTarget);
  });
  async function openAlbum(id){
    const albums=await JP.listAlbums(meId);
    const a=albums.find(x=>x.id===id);
    document.getElementById('alTitle').textContent=a?a.title:'Album';
    const photos=await JP.albumPhotos(id);
    document.getElementById('alBody').innerHTML = photos.length
      ? '<div class="photo-grid">'+photos.map(p=>`<div class="ph" data-pid="${p.id}"><img src="${p.url}" loading="lazy">${a&&a.mine?`<button class="ph-del" data-pid="${p.id}" title="Supprimer">&times;</button>`:''}</div>`).join('')+'</div>'
      : '<p style="color:var(--ink-soft)">Album vide. Ajoute des photos !</p>';
    document.getElementById('alFoot').innerHTML = (a&&a.mine)
      ? '<button class="btn btn-ghost btn-sm" id="alDel" style="color:var(--rouge);margin-right:auto" type="button">Supprimer l\'album</button><button class="btn btn-primary btn-sm" id="alAdd" type="button">Ajouter des photos</button>'
      : '';
    document.querySelectorAll('#alBody .ph img').forEach(img=>img.addEventListener('click',()=>{ document.getElementById('lbImg').src=img.src; document.getElementById('lightbox').classList.add('open'); }));
    if(a&&a.mine){
      document.getElementById('alAdd').addEventListener('click',()=>{ albumTarget=id; albumFile.click(); });
      document.getElementById('alDel').addEventListener('click',async()=>{ if(confirm('Supprimer cet album et toutes ses photos ?')){ await JP.deleteAlbum(id); albumModal.classList.remove('open'); await renderAlbums(); } });
      document.querySelectorAll('#alBody .ph-del').forEach(b=>b.addEventListener('click',async(e)=>{ e.stopPropagation(); if(confirm('Supprimer cette photo ?')){ await JP.deleteAlbumPhoto(b.dataset.pid); await openAlbum(id); renderAlbums(); } }));
    }
    albumModal.classList.add('open');
  }

  document.querySelectorAll('.profile-tabs button').forEach(b=>b.addEventListener('click',async()=>{
    document.querySelectorAll('.profile-tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const tab=b.dataset.tab;
    document.getElementById('mine').style.display = tab==='posts'?'':'none';
    document.getElementById('photos').style.display = tab==='photos'?'':'none';
    document.getElementById('albums').style.display = tab==='albums'?'':'none';
    if(tab==='photos' && !photosLoaded){ photosLoaded=true; await renderPhotos(); }
    if(tab==='albums' && !albumsLoaded){ albumsLoaded=true; await renderAlbums(); }
  }));
  const lb=document.getElementById('lightbox');
  lb.querySelector('.lb-close').addEventListener('click',()=>lb.classList.remove('open'));
  lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.remove('open'); });

  // Agrandir sa photo de profil / sa couverture au clic
  const openImg=src=>{ if(!src) return; document.getElementById('lbImg').src=src; lb.classList.add('open'); };
  const avBoxEl=document.getElementById('avBox');
  if(avBoxEl) avBoxEl.addEventListener('click',e=>{ const i=e.target.closest('img'); if(i) openImg(i.src); });
  const coverEl=document.getElementById('cover');
  if(coverEl) coverEl.addEventListener('click',()=>{ if(me.cover) openImg(me.cover); });

  // Membres bloqués
  async function renderBlocked(){
    const list=await JP.blockedList();
    const sec=document.getElementById('blockedSection');
    if(!list.length){ sec.style.display='none'; return; }
    sec.style.display='block';
    document.getElementById('blockedList').innerHTML=list.map(b=>`
      <div class="result-member">
        ${JP.avatarHTML(b.name,b.avatar,'av')}
        <div class="ri"><b>${JP.esc(b.name)}</b><span>📍 ${JP.esc(b.town||'Jura')}</span></div>
        <div class="ra"><button class="btn btn-ghost btn-sm unblock" data-uid="${b.id}">Débloquer</button></div>
      </div>`).join('');
    document.querySelectorAll('.unblock').forEach(btn=>btn.addEventListener('click',async()=>{
      await JP.unblock(btn.dataset.uid); JP.toast('Membre débloqué'); await renderBlocked();
    }));
  }
  await renderBlocked();
})();
</script>
